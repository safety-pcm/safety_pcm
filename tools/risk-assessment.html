<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위험성평가 관리</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>window.TOOL_KEY = "ra";</script>
<script src="../auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F0;--surface:#FFFFFF;--surface-2:#E9ECE7;--ink:#1D2830;--ink-2:#55616A;--line:#D3D8D1;
  --accent:#F2B600;--accent-edge:#C79600;--tape:#1D2830;--cur-bg:#FFF8DC;
  --plan:#2A8074;--do:#B56E1D;--check:#4E5AA6;--act:#636B73;
  --plan-bg:#E2F0ED;--do-bg:#F7EADA;--check-bg:#E5E7F4;--act-bg:#E9EAEB;
  --danger:#BF3328;--danger-bg:#FBE6E3;--ok:#2B7545;--ok-bg:#E1F1E6;--warn:#9A6212;--warn-bg:#FBEFD6;
  --shadow:0 10px 40px rgba(20,30,36,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171B;--surface:#192126;--surface-2:#212A30;--ink:#E5E9EB;--ink-2:#9FAAB1;--line:#2D383F;
    --accent:#F2B600;--accent-edge:#F2B600;--tape:#0B0F12;--cur-bg:#29250F;
    --plan:#5DB5A8;--do:#DFA153;--check:#8E98DA;--act:#A4ABB2;
    --plan-bg:#15302C;--do-bg:#33261A;--check-bg:#1F2338;--act-bg:#23282C;
    --danger:#E46A5F;--danger-bg:#3A1D1A;--ok:#63B480;--ok-bg:#16301F;--warn:#E2AC4E;--warn-bg:#352812;
    --shadow:0 10px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#11171B;--surface:#192126;--surface-2:#212A30;--ink:#E5E9EB;--ink-2:#9FAAB1;--line:#2D383F;
  --accent:#F2B600;--accent-edge:#F2B600;--tape:#0B0F12;--cur-bg:#29250F;
  --plan:#5DB5A8;--do:#DFA153;--check:#8E98DA;--act:#A4ABB2;
  --plan-bg:#15302C;--do-bg:#33261A;--check-bg:#1F2338;--act-bg:#23282C;
  --danger:#E46A5F;--danger-bg:#3A1D1A;--ok:#63B480;--ok-bg:#16301F;--warn:#E2AC4E;--warn-bg:#352812;
  --shadow:0 10px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
body.lock{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.3;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px 6px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-right:auto}
.brand i{display:block;width:16px;height:16px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--accent) 0 4px,var(--tape) 4px 8px)}
.sync{font-size:12px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.sync.local,.sync.revoked{color:var(--warn);border-color:var(--warn)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
textarea{resize:vertical;line-height:1.5}
.ctrls select{width:auto;max-width:220px;font-weight:600}
.month{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;min-height:40px}
.month span{padding:0 6px;font-weight:600;white-space:nowrap}
.icon{appearance:none;border:0;background:none;width:36px;height:38px;font-size:20px;cursor:pointer;color:var(--ink-2)}
.me{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;min-height:40px;padding:0 12px;cursor:pointer;white-space:nowrap}
.me b{font-weight:600;margin-right:4px}
.tabs{max-width:1120px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 10px 9px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;line-height:18px;text-align:center}

main{max-width:1120px;margin:0 auto;padding:16px 16px 96px}

/* buttons, badges */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent-edge);color:#1D2830;font-weight:600}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.danger-t{color:var(--danger);border-color:transparent;background:none}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2);padding:0 8px}
.btn.ghost:hover{color:var(--ink);border-color:transparent;text-decoration:underline}
.btn.sm{min-height:32px;padding:0 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;line-height:20px}
.g-low{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.g-mid{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.g-high{color:#fff;background:var(--danger);border-color:var(--danger)}
.g-none{color:var(--ink-2)}
.role{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* layout pieces */
.vh{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.vh .sub{color:var(--ink-2);margin-top:4px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:14px}
.card-h{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.card .sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols>.card{margin-top:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty h1{color:var(--ink);margin-bottom:8px}
.empty .acts{justify-content:center;margin-top:14px}
.banner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--cur-bg);border:1px solid var(--accent-edge);border-radius:6px;padding:10px 14px;margin-bottom:14px}
dl{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv dt{color:var(--ink-2);font-size:14px}
.kv dd{margin:0}
.pre{white-space:pre-wrap}
.muted{color:var(--ink-2)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:10px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log time{color:var(--ink-2);font-size:13px;margin-right:6px}

/* summary */
.summary{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.sum-site{color:var(--ink-2);font-weight:500}
.summary h1{font-size:26px;margin:2px 0 12px}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--ink);border-radius:5px}
.sum-now{margin-top:10px}
.sum-now b{font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.facts dt{font-size:13px;color:var(--ink-2)}
.facts dd{margin:0;font-size:20px;font-weight:600}
.facts dd small{display:block;font-size:13px;font-weight:400;color:var(--ink-2)}
.facts dd.dsm{font-size:16px}
.facts dd.bad{color:var(--danger)}
details.proc{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
details.proc summary{cursor:pointer;font-weight:600}
details.proc div{margin-top:8px}

/* PDCA bands */
.band{display:grid;grid-template-columns:112px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:14px;overflow:hidden}
.band-plan{--ph:var(--plan);--ph-bg:var(--plan-bg)}
.band-do{--ph:var(--do);--ph-bg:var(--do-bg)}
.band-check{--ph:var(--check);--ph-bg:var(--check-bg)}
.band-act{--ph:var(--act);--ph-bg:var(--act-bg)}
.band-head{background:var(--ph-bg);color:var(--ph);padding:16px 14px;border-right:1px solid var(--line)}
.band-head .ph{display:block;font-size:22px;font-weight:700;line-height:1.2}
.band-head .en{font-size:14px;font-weight:500}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 16px 12px 18px;border-bottom:1px solid var(--line)}
.step.current{background:var(--cur-bg)}
.step.current::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:repeating-linear-gradient(135deg,var(--accent) 0 6px,var(--tape) 6px 12px)}
.num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.step.done .num{background:var(--ph);border-color:var(--ph);color:#fff}
.step.current .num{border:2px solid var(--ink);color:var(--ink)}
.step.wait .t{color:var(--ink-2)}
.step-t{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.step-t .t{font-weight:600}
.who{font-size:14px;color:var(--ink-2);margin-top:3px}
.who time{margin-left:4px}
.memo{font-size:14px;margin-top:4px;padding-left:10px;border-left:2px solid var(--line)}
.need{font-size:14px;color:var(--warn);margin-top:4px}
.wait-t{font-size:14px;color:var(--ink-2);margin-right:4px}
.step .acts{margin-top:6px}
.step.wait .acts,.step.done .acts{margin-top:2px}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface-2)}
.lane{padding:10px 16px;font-size:14px;border-right:1px solid var(--line)}
.lane:last-child{border-right:0}
.lane b{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:2px}
.lane button{appearance:none;border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.fb{border-color:var(--danger)}
.fb h2{color:var(--danger)}

/* hazards */
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);margin-left:auto}
.hz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hz{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.hz[data-act]:hover{border-color:var(--ink-2)}
.hz.focus{border-left:4px solid var(--danger)}
.hz-top{display:flex;gap:8px;justify-content:space-between;align-items:center}
.trade{font-size:13px;color:var(--ink-2);font-weight:500}
.hz-t{font-weight:600;font-size:16px}
.hz-d{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}
.hz-d dt{color:var(--ink-2)}
.hz-d dd{margin:0}
.hz-score{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.src{font-size:12px;color:var(--ink-2);margin-left:auto}

/* check */
.pair{display:grid;grid-template-columns:1fr 36px 1fr;align-items:start}
.pair>.card{margin-top:0}
.plus{align-self:center;text-align:center;font-size:30px;font-weight:300;color:var(--ink-2)}
.indic{list-style:none;margin:8px 0 12px;padding:0;display:grid;gap:6px;font-size:14px}
.indic li{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.rec{list-style:none;margin:0;padding:0}
.rec li{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:4px}
.rec .r1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rec .r1 b{font-weight:600;margin-right:4px}

/* ncr / proposals */
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:8px}
.item.open{border-left:4px solid var(--warn)}
.item.late{border-left:4px solid var(--danger)}
.item.closed{opacity:.85}
.item-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item-t{font-weight:600}
.reply{background:var(--surface-2);border-radius:6px;padding:8px 10px;font-size:14px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.tbl{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:var(--surface-2);font-weight:600;color:var(--ink-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.linkish{appearance:none;border:0;background:none;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--surface-2);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink)}

/* modal */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov{position:absolute;inset:0;background:rgba(10,15,18,.55)}
.panel{position:relative;background:var(--surface);border-radius:8px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.x{appearance:none;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ink-2);width:36px;height:36px}
.panel-b{padding:14px 18px;overflow-y:auto}
.panel-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.panel-f .sp{flex:1}
.intro{color:var(--ink-2);margin-bottom:10px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.lab{font-size:14px;font-weight:500}
.lab em{font-style:normal;color:var(--danger);font-size:12px;margin-left:4px}
.f small{color:var(--ink-2);font-size:13px}
.note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:8px 10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.ck{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;min-height:0}
.preview{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:10px}
.filepv{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.filepv .ph{position:relative;width:72px;height:72px}
.filepv .ph img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.filepv .ph button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;min-height:0;padding:0;border-radius:50%;background:var(--danger);color:#fff;border:1px solid var(--danger);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:1em}
.sec-t{grid-column:1/-1;font-weight:600;font-size:14px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:760px){
  h1{font-size:20px}
  .summary{grid-template-columns:1fr}
  .summary h1{font-size:22px}
  .band{grid-template-columns:1fr}
  .band-head{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;padding:10px 16px}
  .band-head .ph{display:inline;font-size:18px}
  .lanes{grid-template-columns:1fr}
  .lane{border-right:0;border-top:1px solid var(--line)}
  .hz-grid,.cols{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr}
  .plus{padding:4px 0}
  .legend{margin-left:0}
  .grid{grid-template-columns:1fr}
  #modal{padding:0;align-items:flex-end}
  .panel{max-width:none;border-radius:12px 12px 0 0;max-height:94vh}
  .ctrls{width:100%}
  .ctrls .sel{flex:1;min-width:0}
  .ctrls select{max-width:none;width:100%}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view" aria-live="polite"></main>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nl=v=>esc(v).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const nowStr=()=>{const d=new Date();return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const thisMonth=()=>today().slice(0,7);
const monthLabel=m=>{const p=m.split('-');return `${p[0]}년 ${+p[1]}월`;};
const shiftMonth=(m,n)=>{const p=m.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const firstWeekday=(m,wd)=>{const p=m.split('-').map(Number);const d=new Date(p[0],p[1]-1,1);while(d.getDay()!==wd)d.setDate(d.getDate()+1);return ymd(d);};
const addDays=(s,n)=>{const p=s.slice(0,10).split('-').map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+n));};
const DOW='일월화수목금토';
const dateK=s=>{if(!s)return '-';const p=s.slice(0,10).split('-').map(Number);if(p.length<3||!p[2])return esc(s);const x=new Date(p[0],p[1]-1,p[2]);return `${p[1]}월 ${p[2]}일(${DOW[x.getDay()]})`;};
const short=(s,n)=>{s=String(s||'');n=n||40;return s.length>n?s.slice(0,n)+'…':s;};
const LS={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fileSafe=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'_').trim();

function readImageCompressed(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error);
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('image load failed'));
      img.onload=()=>{
        let w=img.width,h=img.height;const scale=Math.min(1,maxDim/Math.max(w,h)||1);
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800);}

const Q={};
function enqueue(path,fn){const run=(Q[path]||Promise.resolve()).then(fn,fn);Q[path]=run.catch(()=>{});return run;}
function mergeDeep(t,p){Object.keys(p).forEach(k=>{const v=p[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))mergeDeep(t[k],v);else t[k]=v;});return t;}
function saveLocal(){LS.set('ra-local',{sites:S.sites,cycles:S.cycles,config:S.config});}
function dbErr(e){
  const code=e&&e.code;
  if(code==='quota_exceeded')toast('저장 공간 한도에 도달했습니다. 오래된 기록을 정리한 뒤 다시 저장하세요.');
  else if(code==='invalid_argument')toast('저장하지 못했습니다. 이 페이지에 대한 편집 권한이 있는지 확인하세요.');
  else if(code==='resource_exhausted')toast('요청이 많아 잠시 저장이 지연됩니다. 잠시 후 다시 시도하세요.');
  else if(code==='revoked'||code==='permission-denied'){S.mode='revoked';render();toast('접근 권한이 변경되어 저장할 수 없습니다.');}
  else toast('저장하지 못했습니다. 잠시 후 다시 시도하세요.');
}
async function write(col,id,data,merge){
  await ready;
  if(S.mode==='revoked'){toast('접근 권한이 변경되어 저장할 수 없습니다.');return false;}
  if(S.mode==='shared'){
    const ref=S.db.collection(col).doc(id);
    const attempt=()=>merge?ref.set(data,{merge:true}):ref.set(data);
    try{await enqueue(col+'/'+id,attempt);return true;}
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,500+Math.random()*700));try{await enqueue(col+'/'+id,attempt);return true;}catch(e2){dbErr(e2);return false;}}
      dbErr(e);return false;
    }
  }
  if(col==='config')S.config=merge?mergeDeep(clone(S.config||{}),data):clone(data);
  else{const b=col==='sites'?S.sites:S.cycles;b[id]=merge?mergeDeep(clone(b[id]||{}),data):clone(data);}
  saveLocal();render();return true;
}
async function remove(col,id){
  await ready;
  if(S.mode==='shared'&&S.level!=='delete'){toast('삭제는 관리자만 할 수 있습니다.');return false;}
  if(S.mode==='shared'){try{await enqueue(col+'/'+id,()=>S.db.collection(col).doc(id).delete());return true;}catch(e){dbErr(e);return false;}}
  const b=col==='sites'?S.sites:S.cycles;delete b[id];saveLocal();render();return true;
}

async function initStore(){
  let db=null;
  /* 툴박스 Firebase(Firestore) 연결 — 컬렉션은 ra_sites / ra_cycles / ra_config 로 분리 저장 */
  const SA=window.SafetyAuth;
  if(SA&&SA.configured()&&SA.boot()){
    const user=await new Promise(res=>{const off=SA.auth.onAuthStateChanged(u=>{off();res(u);});});
    if(!user)return;                       // 로그인 안내는 auth.js 화면이 담당
    let prof={};
    try{const snap=await SA.db.collection('users').doc(user.uid).get();prof=snap.exists?snap.data():{};}catch(e){}
    const lv=SA.level(prof.role||'pending','ra');
    if(!lv)return;                         // 권한 없음 안내도 auth.js 화면이 담당
    S.level=lv;
    if(!me.name&&(prof.name||user.displayName)){me.name=prof.name||user.displayName;}
    const fs=SA.db, MAP={sites:'ra_sites',cycles:'ra_cycles',config:'ra_config'};
    const mp=p=>{const a=p.split('/');if(MAP[a[0]])a[0]=MAP[a[0]];return a.join('/');};
    db={collection:n=>fs.collection(mp(n)),doc:p=>fs.doc(mp(p))};
  }
  if(!db){
    const L=LS.get('ra-local',{});S.sites=L.sites||{};S.cycles=L.cycles||{};S.config=L.config||null;S.mode='local';
    readyResolve();render();return;
  }
  S.db=db;S.mode=S.level==='read'?'revoked':'shared';
  const onErr=e=>{if(e&&(e.code==='revoked'||e.code==='permission-denied')){S.mode='revoked';render();}else if(e&&e.code==='unavailable'){toast('연결이 끊겼습니다. 페이지를 새로고침하면 다시 연결됩니다.');}};
  db.collection('sites').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S.sites=o;render();},onErr);
  db.collection('cycles').limit(1000).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});S.cycles=o;render();},onErr);
  db.doc('config/main').onSnapshot(d=>{S.config=d.exists?d.data():null;render();},onErr);
  readyResolve();render();
}

async function saveFile(name,data){
  name=fileSafe(name);

    catch(e){if(!(e&&e.code==='declined'))toast('파일을 저장하지 못했습니다.');}

  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();}

function optPair(op){return Array.isArray(op)?op:[op,op];}
function openForm(o){
  const m=$('#modal');const vals=o.values||{};
  const fieldHtml=f=>{
    if(f.type==='note')return `<div class="f full"><div class="note">${f.html}</div></div>`;
    if(f.type==='section')return `<div class="sec-t">${esc(f.label)}</div>`;
    const id='f_'+f.k;const v=vals[f.k];let input;
    if(f.type==='file')return `<div class="f full"><span class="lab">${esc(f.label)}${f.req?'<em>필수</em>':''}</span><input id="${id}" type="file" accept="image/*" multiple><div class="filepv" id="${id}_pv"></div>${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
    if(f.type==='textarea')input=`<textarea id="${id}" name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else if(f.type==='select')input=`<select id="${id}" name="${f.k}">${f.options.map(op=>{const p=optPair(op);return `<option value="${esc(p[0])}" ${String(v==null?'':v)===String(p[0])?'selected':''}>${esc(p[1])}</option>`;}).join('')}</select>`;
    else if(f.type==='checks'){const arr=Array.isArray(v)?v:[];input=`<div class="checks">${f.options.map(op=>{const p=optPair(op);return `<label class="ck"><input type="checkbox" name="${f.k}" value="${esc(p[0])}" ${arr.indexOf(p[0])>=0?'checked':''}><span>${esc(p[1])}</span></label>`;}).join('')}</div>`;}
    else input=`<input id="${id}" name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.type==='number'?' inputmode="numeric"':''}>`;
    const lab=f.type==='checks'?`<span class="lab">${esc(f.label)}${f.req?'<em>필수</em>':''}</span>`:`<label class="lab" for="${id}">${esc(f.label)}${f.req?'<em>필수</em>':''}</label>`;
    return `<div class="f ${f.half?'half':'full'}">${lab}${input}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
  };
  m.innerHTML=`<div class="ov" data-close></div><form class="panel" novalidate role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="panel-h"><h2 id="mt">${esc(o.title)}</h2><button type="button" class="x" data-close aria-label="닫기">×</button></div>
    <div class="panel-b">${o.intro?`<p class="intro">${o.intro}</p>`:''}<div class="grid">${(o.fields||[]).map(fieldHtml).join('')}</div>${o.preview?'<div class="preview" id="fp"></div>':''}<p class="err" id="ferr" role="alert"></p></div>
    <div class="panel-f">${o.del?'<button type="button" class="btn danger-t" id="fdel">삭제</button>':''}<span class="sp"></span><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn ${o.danger?'danger':'dark'}">${esc(o.submit||'저장')}</button></div>
  </form>`;
  m.hidden=false;document.body.classList.add('lock');
  const form=m.querySelector('form');
  const fileVals={};(o.fields||[]).filter(f=>f.type==='file').forEach(f=>{fileVals[f.k]=Array.isArray(vals[f.k])?vals[f.k].slice():[];});
  const renderFilePv=k=>{
    const pv=form.querySelector(`#f_${k}_pv`);if(!pv)return;
    pv.innerHTML=fileVals[k].map((p,i)=>`<span class="ph"><img src="${p.data}" alt="${esc(p.name||'사진')}"><button type="button" data-rmphoto="${k}" data-i="${i}" aria-label="사진 삭제">×</button></span>`).join('');
  };
  form.querySelectorAll('input[type=file]').forEach(fi=>{
    const k=fi.id.replace(/^f_/,'');
    renderFilePv(k);
    fi.addEventListener('change',async()=>{
      const files=Array.from(fi.files||[]);fi.value='';
      for(const file of files){
        try{const data=await readImageCompressed(file,1024,.7);fileVals[k].push({name:file.name,data});}catch(e){}
      }
      renderFilePv(k);
    });
  });
  form.addEventListener('click',e=>{
    const b=e.target.closest('[data-rmphoto]');if(!b)return;
    const k=b.dataset.rmphoto;fileVals[k].splice(+b.dataset.i,1);renderFilePv(k);
  });
  const collect=()=>{const out={};(o.fields||[]).forEach(f=>{if(!f.k)return;if(f.type==='file')out[f.k]=fileVals[f.k]||[];else if(f.type==='checks')out[f.k]=Array.from(form.querySelectorAll(`input[name="${f.k}"]:checked`)).map(x=>x.value);else{const el=form.querySelector(`[name="${f.k}"]`);out[f.k]=el?el.value.trim():'';}});return out;};
  const upd=()=>{if(o.onInput)o.onInput(collect(),form.querySelector('#fp'));};
  form.addEventListener('input',upd);form.addEventListener('change',upd);upd();
  m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  if(o.del){const d=form.querySelector('#fdel');d.addEventListener('click',async()=>{if(!d.dataset.armed){d.dataset.armed='1';d.textContent='한 번 더 누르면 삭제';return;}d.disabled=true;const r=await o.del();if(r!==false)closeModal();else d.disabled=false;});}
  form.addEventListener('submit',async e=>{
    e.preventDefault();const v=collect();
    const miss=(o.fields||[]).filter(f=>f.req&&!(Array.isArray(v[f.k])?v[f.k].length:v[f.k]));
    if(miss.length){form.querySelector('#ferr').textContent=`${miss.map(f=>f.label).join(', ')} 항목을 입력하세요.`;return;}

    catch(err){btn.disabled=false;form.querySelector('#ferr').textContent='저장하지 못했습니다. 다시 시도하세요.';}
  });
  setTimeout(()=>{if(window.matchMedia&&window.matchMedia('(pointer:fine)').matches){const first=form.querySelector('.panel-b input:not([type=checkbox]),.panel-b select,.panel-b textarea');if(first)first.focus();}},30);
}

/* ----- flow ----- */
function stepState(c,i){if(c.steps[STEPS[i].k])return 'done';return STEPS.slice(0,i).every(x=>c.steps[x.k])?'current':'wait';}
function submitPartnerLine(c){
  const site=S.sites[ui.siteId];const partners=(site&&site.partners)||[];
  if(!partners.length)return '';
  const counts={};c.hazards.forEach(h=>{if(h.partner)counts[h.partner]=(counts[h.partner]||0)+1;});
  return `<p class="who" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center">협력업체별 등록<span aria-hidden="true">:</span> ${partners.map(p=>`<span class="badge ${counts[p.name]?'g-low':'g-high'}">${esc(p.name)} ${counts[p.name]?'등록':'미등록'}</span>`).join('')}</p>`;
}
function stepRow(c,s,i,lastDone){
  const st=stepState(c,i);const d=c.steps[s.k];const can=s.roles.indexOf(me.role)>=0;
  const skippable=s.k==='review1'||s.k==='review2';
  let body='',acts='';
  if(st==='done')body=d.skipped?`<p class="who">해당없음 처리 ${esc(d.by)} <span class="role">${esc(d.role)}</span><time>${esc(d.at)}</time></p>`:`<p class="who">완료 ${esc(d.by)} <span class="role">${esc(d.role)}</span><time>${esc(d.at)}</time></p>${d.note?`<p class="memo">${nl(d.note)}</p>`:''}`;
  if(s.k==='submit')body+=submitPartnerLine(c);
  const unmet=st==='current'&&s.need&&!s.need(c);
  if(st==='current'){
    if(unmet)body+=`<p class="need">${esc(s.needMsg)}</p>`;
    if(can){acts+=`<button class="btn primary" data-act="complete" data-k="${s.k}" ${unmet?'disabled':''}>완료 처리</button>`;if(s.reject)acts+=`<button class="btn" data-act="reject" data-k="${s.k}">반려</button>`;if(skippable)acts+=`<button class="btn ghost" data-act="skipStep" data-k="${s.k}">해당없음</button>`;}
    else acts+=`<span class="wait-t">${esc(s.roles.join(' 또는 '))} 처리 대기</span>`;
  }
  if(st==='done'&&s.k===lastDone&&d.role===me.role)acts+=`<button class="btn ghost sm" data-act="undo" data-k="${s.k}">완료 취소</button>`;
  acts+=`<button class="btn ghost sm" data-act="tab" data-tab="${s.tab}">${TABNAME[s.tab]} 열기</button>`;
  return `<li class="step ${st}"><span class="num" aria-hidden="true">${i+1}</span><div><div class="step-t"><span class="t">${esc(s.t)}</span><span class="role">${esc(s.roles.join(', '))}</span></div>${body}<div class="acts">${acts}</div></div></li>`;
}
function laneWorker(c,ph){
  if(ph.k==='P'){const n=c.educations.reduce((a,e)=>a+(+e.count||0),0);return `${ph.worker}<br><button data-act="tab" data-tab="check">교육 참석 ${n}명</button>`;}
  if(ph.k==='D')return `${ph.worker}<br><button data-act="tab" data-tab="worker">근로자 의견 ${c.proposals.length}건</button>`;
  if(ph.k==='C')return `${ph.worker}<br><button data-act="tab" data-tab="worker">발굴·전달 ${c.proposals.filter(p=>p.kind!=='개선의견').length}건</button>`;

}
function viewFlow(){

      <p class="sum-now">${cs?`지금 단계 <b>${ci+1}. ${esc(cs.t)}</b> <span class="role">${esc(cs.roles.join(', '))}</span>`:'<b>이번 달 모든 단계를 마쳤습니다.</b>'}</p>

    <p>평가 방법: 위험성을 상/중/하로 직접 판정합니다. 중점관리 기준: ${(C.focusGrades||['상']).join(', ')} 판정.</p>

  if(c.feedback.length)h+=`<section class="card fb"><h2>반려 및 Feed Back 기록</h2><ul class="log">${c.feedback.slice().reverse().map(f=>`<li><time>${esc(f.at)}</time>${esc(f.by)} <span class="role">${esc(f.role)}</span> ${esc(f.stepName)} 단계에서 반려<div class="pre">${esc(f.reason)}</div></li>`).join('')}</ul></section>`;
  PHASES.forEach(ph=>{

  });
  return h;
}

function prevSummary(){
  const pm=shiftMonth(ui.month,-1);const p=norm(S.cycles[cid(ui.siteId,pm)]);
  if(!p)return '';
  const pInsp=p.inspections;const pNg=pInsp.reduce((n,x)=>n+(x.items||[]).filter(i=>i.r==='미이행').length,0);
  const pConf=p.steps.confirm&&p.steps.confirm.at;const pDeadline=pConf?addDays(pConf,2):null;
  const pRegOk=pConf?p.educations.some(e=>e.kind==='공정별 정기교육'&&e.date>=pConf.slice(0,10)&&e.date<=pDeadline):null;
  const pTbm=p.educations.filter(e=>e.kind==='TBM 일일 안전교육').length;
  const done=p.ncrs.filter(n=>n.status==='확인완료').length;const open=p.ncrs.filter(n=>n.status!=='확인완료');
  const lines=[`${monthLabel(pm)} 안전점검 ${pInsp.length}회 실시, 미이행 ${pNg}건 발견 (2일 이내 정기교육 ${pRegOk===null?'확정 전':pRegOk?'이행':'미이행'}, TBM ${pTbm}회)`];
  lines.push(`${monthLabel(pm)} 부적합 ${p.ncrs.length}건 중 확인완료 ${done}건, 미완료 ${open.length}건`);
  open.forEach(n=>lines.push(`미완료: ${short(n.content,50)} (${n.partner||'담당 미지정'})`));
  const props=p.proposals;if(props.length)lines.push(`근로자 의견 ${props.length}건 중 반영 ${props.filter(x=>x.status==='반영').length}건`);
  props.filter(x=>x.kind==='개선의견').forEach(x=>lines.push(`개선의견: ${short(x.content,50)}`));
  if(p.meeting.decisions)lines.push(`전월 결정사항: ${short(p.meeting.decisions.replace(/\n/g,' '),80)}`);
  return lines.join('\n');
}

  const unconf=insp.filter(x=>!x.confirmer).length;

/* ----- ncr ----- */
function viewNcr(){
  const g=needCycle();if(g)return g;
  const c=cur();const t=today();
  const f=ui.ncrFilter;
  let list=c.ncrs.slice();
  if(f==='진행중')list=list.filter(n=>n.status!=='확인완료');else if(f==='확인완료')list=list.filter(n=>n.status==='확인완료');
  list.sort((a,b)=>NCR_ST.indexOf(a.status)-NCR_ST.indexOf(b.status)||String(a.due||'').localeCompare(String(b.due||'')));
  const nOpen=c.ncrs.filter(n=>n.status!=='확인완료').length;
  const isMgr=MANAGERS.indexOf(me.role)>=0;const isSafety=['안전관리자','현장소장'].indexOf(me.role)>=0;
  const hz=id=>c.hazards.find(h=>h.id===id);
  return `<div class="vh"><div><h1>부적합 사항 시정조치</h1><p class="sub">점검과 근로자 의견에서 나온 부적합을 협력업체에 Feed Back하고, 조치 결과를 안전관리자가 확인합니다.</p></div>
    <div class="acts">${isMgr?'<button class="btn primary" data-act="addNcr">부적합 등록</button>':''}</div></div>
  <div class="filterbar">${[['진행중',nOpen],['확인완료',c.ncrs.length-nOpen],['전체',c.ncrs.length]].map(x=>`<button class="chip" aria-pressed="${f===x[0]}" data-act="ncrFilter" data-v="${x[0]}">${x[0]} ${x[1]}</button>`).join('')}</div>
  ${list.length?`<div class="list">${list.map(n=>{
    const late=n.status==='조치요청'&&n.due&&n.due<t;const h=n.hazardId?hz(n.hazardId):null;
    const cls=n.status==='확인완료'?'closed':late?'late':'open';
    let acts='';
    if(n.status==='조치요청'&&me.role&&me.role!=='근로자')acts+=`<button class="btn primary sm" data-act="ncrAction" data-id="${esc(n.id)}">조치 결과 입력</button>`;
    if(n.status==='조치완료'&&isSafety)acts+=`<button class="btn primary sm" data-act="ncrConfirm" data-id="${esc(n.id)}">확인 완료</button><button class="btn sm" data-act="ncrReopen" data-id="${esc(n.id)}">재조치 요청</button>`;
    if(isSafety)acts+=`<button class="btn ghost sm" data-act="editNcr" data-id="${esc(n.id)}">수정</button>`;
    return `<article class="item ${cls}"><div class="item-top"><span class="badge ${n.status==='확인완료'?'g-low':n.status==='조치완료'?'g-mid':''}">${esc(n.status)}</span>${late?'<span class="badge g-high">기한 경과</span>':''}<span class="src">${esc(n.source||'')}</span></div>
      <p class="item-t pre">${esc(n.content)}</p>
      <dl class="kv"><dt>발견일</dt><dd>${dateK(n.found)}</dd><dt>조치 담당</dt><dd>${esc(n.partner||'-')}</dd><dt>조치 기한</dt><dd>${dateK(n.due)}</dd>${h?`<dt>관련 위험요인</dt><dd>${esc(short(h.hazard,60))}</dd>`:''}
      ${n.action?`<dt>조치 내용</dt><dd class="pre">${esc(n.action)} <span class="muted">(${esc(n.actor||'')} ${dateK(n.actionDate)})</span></dd>`:''}
      ${n.confirmer?`<dt>확인</dt><dd>${esc(n.confirmer)} ${esc(n.confirmedAt||'')}${n.confirmNote?` <span class="muted">${esc(n.confirmNote)}</span>`:''}</dd>`:''}</dl>
      ${(n.history||[]).length?`<div class="reply">${n.history.map(x=>`${esc(x.at)} ${esc(x.by)}: ${esc(x.text)}`).join('<br>')}</div>`:''}
      ${acts?`<div class="acts">${acts}</div>`:''}</article>`;}).join('')}</div>`:`<div class="empty"><p>${f==='진행중'?'진행 중인 부적합 사항이 없습니다.':'해당하는 부적합 사항이 없습니다.'}</p></div>`}`;
}
function ncrForm(n){
  const c=cur();
  openForm({title:n?'부적합 사항 수정':'부적합 등록',values:Object.assign({found:today(),due:addDays(today(),3),source:'안전점검'},n||{}),
    fields:[{k:'found',label:'발견일',type:'date',half:1,req:1},{k:'source',label:'출처',type:'select',options:['안전점검','근로자 의견','안전보건협의체','기타'],half:1},
      {k:'content',label:'부적합 내용',type:'textarea',req:1},
      {k:'hazardId',label:'관련 위험요인',type:'select',options:[['','해당 없음']].concat(c.hazards.map(h=>[h.id,short(h.hazard,50)]))},
      {k:'partner',label:'조치 담당 협력업체',half:1},{k:'due',label:'조치 기한',type:'date',half:1}],
    del:n?async()=>{const cc=cur();return patchCycle({ncrs:cc.ncrs.filter(x=>x.id!==n.id)});}:null,
    onSave:async v=>{const cc=cur();const list=cc.ncrs.slice();
      if(n){const i=list.findIndex(x=>x.id===n.id);if(i>=0)list[i]=Object.assign({},list[i],v);}
      else list.push(Object.assign({id:uid(),status:'조치요청',createdBy:me.name,createdAt:nowStr(),history:[]},v));
      return patchCycle({ncrs:list});}});
}
function updateNcr(id,fn){const c=cur();const list=c.ncrs.slice();const i=list.findIndex(x=>x.id===id);if(i<0)return false;list[i]=fn(Object.assign({},list[i]));return patchCycle({ncrs:list});}

function docShell(title,sub,body,landscape){

}
function signTable(c,cols){
  return `<table class="sign"><tr>${cols.map(x=>`<th>${esc(x[0])}</th>`).join('')}</tr><tr>${cols.map(x=>{const d=c.steps[x[1]];return `<td>${d?(d.skipped?'해당없음':esc(d.by)+'<br><small>'+esc(d.at.slice(5,10))+'</small>'):''}</td>`;}).join('')}</tr></table>`;
}

function partnersForm(siteId){

      <div class="f"><label class="lab">협력업체명</label><input data-f="name" data-id="${esc(r.id)}" value="${esc(r.name)}" placeholder="예: OO건설"></div>
      <div class="f"><label class="lab">담당자(소장)</label><input data-f="manager" data-id="${esc(r.id)}" value="${esc(r.manager)}" placeholder="예: 홍길동"></div>
      <button type="button" class="btn ghost sm" data-del="${esc(r.id)}">삭제</button>
    </div>`).join('');
  }
  m.innerHTML=`<div class="ov" data-close></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="pt">
    <div class="panel-h"><h2 id="pt">협력업체 관리 — ${esc(site.name||'')}</h2><button type="button" class="x" data-close aria-label="닫기">×</button></div>
    <div class="panel-b">
      <p class="intro">여기에 등록한 협력업체는 현장 조직도와 위험성평가표의 협력업체 항목에 자동으로 반영됩니다.</p>

      <button type="button" class="btn sm" id="partAdd">+ 협력업체 추가</button>
    </div>

  </div>`;
  m.hidden=false;document.body.classList.add('lock');
  renderRows();
  m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  m.querySelector('#partRows').addEventListener('input',e=>{
    const t=e.target;if(!t.dataset.f)return;const r=rows.find(x=>x.id===t.dataset.id);if(r)r[t.dataset.f]=t.value;
  });
  m.querySelector('#partRows').addEventListener('click',e=>{
    const b=e.target.closest('[data-del]');if(!b)return;rows=rows.filter(x=>x.id!==b.dataset.del);if(!rows.length)rows=[{id:uid(),name:'',manager:''}];renderRows();
  });
  m.querySelector('#partAdd').addEventListener('click',()=>{rows.push({id:uid(),name:'',manager:''});renderRows();});

    const clean=rows.map(r=>({id:r.id,name:(r.name||'').trim(),manager:(r.manager||'').trim()})).filter(r=>r.name);
    const ok=await write('sites',siteId,{partners:clean},true);
    if(ok){toast('협력업체 목록을 저장했습니다.');closeModal();}
  });
}

      <button type="button" class="btn sm" id="supAdd">+ 관리감독자 추가</button>

    <div class="panel-f"><span class="sp"></span><button type="button" class="btn" data-close>취소</button><button type="button" class="btn dark" id="supSave">저장</button></div>
  </div>`;
  m.hidden=false;document.body.classList.add('lock');
  renderRows();
  m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  m.querySelector('#supRows').addEventListener('input',e=>{
    const t=e.target;if(!t.dataset.f)return;const r=rows.find(x=>x.id===t.dataset.id);if(r)r[t.dataset.f]=t.value;
  });

    const del=e.target.closest('[data-del]');

  });
  m.querySelector('#supAdd').addEventListener('click',()=>{rows.push({id:uid(),name:'',role:'',partnerIds:[]});renderRows();});
  m.querySelector('#supSave').addEventListener('click',async()=>{
    const clean=rows.map(r=>({id:r.id,name:(r.name||'').trim(),role:(r.role||'').trim(),partnerIds:r.partnerIds.slice()})).filter(r=>r.name);
    const ok=await write('sites',siteId,{supervisors:clean},true);
    if(ok){toast('관리감독자 매칭을 저장했습니다.');closeModal();}
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.closest('#modal'))return;
  const fn=ACT[b.dataset.act];if(fn)fn(b.dataset,b,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return;}
  const b=e.target.closest&&e.target.closest('[role="button"][data-act]');
  if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.click();}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.change==='site'&&t.value){ui.siteId=t.value;saveUi();t.blur();render();}
});

render();
initStore();
})();
</script>
</body>
</html>
