<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회의록</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../firebase-config.js"></script>
<script>window.TOOL_KEY = "mt";</script>
<script src="../auth.js"></script>
<style>
  :root{
    --ink:#17212c; --ink-soft:#525f6e; --ink-faint:#8a94a3;
    --paper:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9;
    --line:#dbe0e6; --accent:#1d5673; --accent-soft:#e4edf1; --accent-ink:#ffffff;
    --hazard:#c97f16; --hazard-soft:#faf1e0;
    --bad:#b3372b; --bad-soft:#f7e3e0; --good:#2f7d57; --good-soft:#e1efe7;
    --font:"Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e7ecf1; --ink-soft:#aab5c2; --ink-faint:#7c8896;
      --paper:#0d1218; --surface:#182029; --surface-2:#1d2731;
      --line:#2c3843; --accent:#7fbcdb; --accent-soft:#1c2e38; --accent-ink:#0c222c;
      --hazard:#e0a24a; --hazard-soft:#332810;
      --bad:#e2776b; --bad-soft:#3a201d; --good:#66b98c; --good-soft:#1c2e24;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7ecf1; --ink-soft:#aab5c2; --ink-faint:#7c8896;
    --paper:#0d1218; --surface:#182029; --surface-2:#1d2731;
    --line:#2c3843; --accent:#7fbcdb; --accent-soft:#1c2e38; --accent-ink:#0c222c;
    --hazard:#e0a24a; --hazard-soft:#332810;
    --bad:#e2776b; --bad-soft:#3a201d; --good:#66b98c; --good-soft:#1c2e24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper)}
  body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--surface);border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:20}
  .bar h1{font-size:15px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .role{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
  .banner{margin:12px 16px 0;padding:10px 14px;background:var(--hazard-soft);border:1px solid var(--hazard);font-size:13px}
  .banner[hidden]{display:none}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .view{display:none}.view.on{display:block}
  .card{background:var(--surface);border:1px solid var(--line);padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card h2 .sp{flex:1}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:9px 10px;font:14px var(--font);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:0}
  textarea{min-height:60px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px}
  .grid .s2{grid-column:span 2}.grid .s4{grid-column:span 4}
  @media (max-width:640px){ .grid{grid-template-columns:1fr 1fr} .grid .s4,.grid .s2{grid-column:span 2} }
  button{font-family:var(--font)}
  .btn{font:700 13px var(--font);padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink-faint)}
  .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.danger{color:var(--bad);border-color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn[hidden]{display:none}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:6px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar .sp{flex:1}
  .toolbar input,.toolbar select{width:auto;min-width:0}
  .toolbar #q{flex:1 1 180px}
  .empty{padding:28px;text-align:center;color:var(--ink-faint)}

  /* 목록 */
  .mlist{display:grid;gap:10px}
  .mcard{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font-family:var(--font)}
  .mcard:hover{border-color:var(--accent)}
  .mdate{font-weight:800;font-size:14px;color:var(--accent);line-height:1.3}
  .mdate small{display:block;font-weight:600;font-size:11.5px;color:var(--ink-soft)}
  .mmeta{font-size:12.5px;color:var(--ink-soft)}
  .mtopic{font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--line);color:var(--ink-soft);margin-left:6px;white-space:nowrap}
  .tag.kind{border-color:var(--accent);color:var(--accent);margin-left:0;margin-right:6px}
  .mside{font-size:12px;color:var(--ink-faint);text-align:right;white-space:nowrap}
  @media (max-width:560px){ .mcard{grid-template-columns:78px 1fr} .mside{display:none} }

  /* 결재 */
  .sign{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px}
  @media (max-width:560px){ .sign{grid-template-columns:1fr 1fr} }

  /* 사진 */
  .pickers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .pickers input[type=file]{display:none}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .ph{border:1px solid var(--line);background:var(--surface-2);position:relative}
  .ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;background:#000}
  .ph input{border:none;border-top:1px solid var(--line);background:var(--surface);font-size:12.5px;padding:7px 8px}
  .ph .x{position:absolute;top:4px;right:4px;border:none;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px;cursor:pointer;font-size:16px;line-height:1}
  .ph .new{position:absolute;top:4px;left:4px;font-size:11px;background:var(--hazard);color:#fff;padding:1px 6px}

  .sticky{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;margin:0 -16px -16px;z-index:5}
  .sticky .sp{flex:1}
  .busy{font-size:12.5px;color:var(--ink-soft);align-self:center}

  .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}
  .lb img{max-width:96vw;max-height:92vh}
  .lb[hidden]{display:none}

  /* 인쇄용 서식 — 사내 회의록 양식(한글 원본)과 같은 배치 */
  #printArea{display:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @media print{
    @page{size:A4 portrait;margin:14mm 13mm}
    html,body{background:#fff}
    .bar,main,.banner,.lb,.ro-badge{display:none!important}
    #printArea{display:block}
    .pg{page-break-after:always}
    .pg:last-child{page-break-after:auto}
  }
</style>
</head>
<body>
<div class="bar">
  <h1>회의록</h1>
  <span class="role" id="roleBadge"></span>
</div>
<div class="banner" id="banner" hidden></div>

<main id="app">
  <!-- 목록 -->
  <section class="view on" id="v-list">
    <div class="toolbar">
      <button class="btn pri" id="btnNew" type="button" hidden>+ 새 회의록</button>
      <input id="q" type="search" placeholder="검색 (주요내용·참석자·장소)">
      <select id="fKindFilter"><option value="">전체 회의</option></select>
      <select id="fYear"></select>
    </div>
    <div class="mlist" id="mlist"><div class="card empty">불러오는 중…</div></div>
  </section>

  <!-- 작성·조회 -->
  <section class="view" id="v-edit">
    <div class="toolbar">
      <button class="btn" id="btnBack" type="button">← 목록</button>
      <b id="edTitle" style="font-size:15px"></b>
    </div>

    <div class="card">
      <h2>회의 개요</h2>
      <div class="grid">
        <div class="s2"><label for="fKind">회의종류</label><input id="fKind" list="kindList" placeholder="목록에서 고르거나 직접 입력"><datalist id="kindList"></datalist></div>
        <div><label for="fDate">일자</label><input id="fDate" type="date"></div>
        <div><label for="fTime">시간</label>
          <div style="display:flex;gap:4px;align-items:center"><input id="fStart" type="time"><span>~</span><input id="fEnd" type="time"></div></div>
        <div class="s2"><label for="fPlace">장소</label><input id="fPlace" placeholder="예: 본사 3층 회의실"></div>
        <div class="s2"><label for="fWriter">작성자</label><input id="fWriter"></div>
        <div class="s4"><label for="fAtt">참석자</label><textarea id="fAtt" rows="2" placeholder="예: 박건률 CSO, 오병삼 부장, 박철민 차장, 서경포 과장"></textarea></div>
      </div>
    </div>

    <div class="card">
      <h2>주요내용</h2>
      <textarea id="fSummary" rows="4" placeholder="회의 안건·결정사항을 요약해 적어 주세요."></textarea>
    </div>

    <div class="card">
      <h2>내용</h2>
      <textarea id="fBody" rows="10" placeholder="논의 내용, 지시사항, 후속 조치 등을 적어 주세요."></textarea>
    </div>

    <div class="card">
      <h2>관련사진 <span class="sp"></span><span class="hint" style="margin:0" id="phCount"></span></h2>
      <div class="pickers" id="pickers">
        <label class="btn" style="margin:0;color:var(--ink)">📷 촬영<input id="inCam" type="file" accept="image/*" capture="environment"></label>
        <label class="btn" style="margin:0;color:var(--ink)">사진 선택<input id="inFile" type="file" accept="image/*" multiple></label>
      </div>
      <div class="photos" id="photos"></div>
      <div class="hint" id="phHint">사진은 자동으로 줄여서 저장됩니다. 사진 아래 칸에 설명을 적으면 인쇄할 때 함께 나옵니다.</div>
    </div>


    <div class="sticky">
      <button class="btn pri" id="btnSave" type="button">저장</button>
      <button class="btn" id="btnPrint" type="button">인쇄 / PDF</button>
      <button class="btn" id="btnHwpx" type="button">한글(HWPX) 내려받기</button>
      <span class="busy" id="busy"></span>
      <span class="sp"></span>
      <button class="btn danger" id="btnDel" type="button" hidden>삭제</button>
    </div>
  </section>
</main>

<div class="lb" id="lb" hidden><img id="lbImg" alt="사진 크게 보기"></div>
<div id="printArea"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   회의록  (도구 키: mt)
   - 사내 회의록 양식(회의종류·일시·참석자·작성자·장소·주요내용·내용·관련사진·결재)
   - 저장 컬렉션: mt_minutes (사진은 mt_minutes/{id}/photos 하위 컬렉션)
   - 인쇄/PDF: 양식과 같은 배치 / 한글(HWPX): 원본 양식 파일에 내용을 채워 내려받기
   ========================================================================= */

const SA = window.SafetyAuth;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = () => new Date().toISOString();
const WD = ["일","월","화","수","목","금","토"];
const KINDS = ["주간 안전회의","월간 안전보건 회의","산업안전보건위원회","안전보건협의체","안전보건 경영회의","본사 실무회의","현장 점검 회의","외부 기관 회의","교육·설명회"];
const MAX_PHOTOS = 12;

let db = null;
const S = { user:null, role:"pending", lv:null, name:"", list:[], cur:null, photos:[], dirty:false };

function canWrite(){ return S.lv === "write" || S.lv === "delete"; }
function canDelete(){ return S.lv === "delete"; }
function banner(msg){ const b = $("banner"); b.hidden = !msg; b.innerHTML = msg || ""; }
function onErr(e){
  console.warn(e);
  if(e && e.code === "permission-denied"){
    banner("<b>저장소 권한이 없습니다.</b> Firebase 콘솔 › Firestore › 규칙에 회의록용 규칙(mt_minutes)이 추가되어 있는지 확인해 주세요.");
  }else banner("데이터를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.");
}
function today(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateLabel(m){
  if(!m.date) return "";
  const [y, mo, d] = m.date.split("-").map(Number);
  const wd = WD[new Date(y, mo - 1, d).getDay()];
  const t = m.start ? ` ${m.start}${m.end ? "~" + m.end : ""}` : "";
  return `${y}. ${mo}. ${d}.(${wd})${t}`;
}
function firstLine(s){ return String(s || "").split("\n").map(x => x.trim()).filter(Boolean)[0] || ""; }

/* ---------------- 화면 전환 ---------------- */
function showView(v){
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  window.scrollTo(0, 0);
}
$("btnBack").addEventListener("click", () => {
  if(S.dirty && !confirm("저장하지 않은 내용이 있습니다. 목록으로 갈까요?")) return;
  S.dirty = false; S.cur = null; showView("list");
});

/* =========================================================================
   목록
   ========================================================================= */
function filtered(){
  const q = $("q").value.trim().toLowerCase(), k = $("fKindFilter").value, y = $("fYear").value;
  return S.list.filter(m => (!k || m.kind === k) && (!y || String(m.date || "").startsWith(y)) &&
    (!q || [m.kind, m.summary, m.body, m.attendees, m.place, m.writer].join(" ").toLowerCase().includes(q)));
}
function renderFilters(){
  const kinds = Array.from(new Set(S.list.map(m => m.kind).filter(Boolean))).sort();
  const curK = $("fKindFilter").value;
  $("fKindFilter").innerHTML = `<option value="">전체 회의</option>` + kinds.map(k => `<option${k === curK ? " selected" : ""}>${esc(k)}</option>`).join("");
  const years = Array.from(new Set(S.list.map(m => String(m.date || "").slice(0, 4)).filter(Boolean))).sort().reverse();
  const curY = $("fYear").value;
  $("fYear").innerHTML = `<option value="">전체 연도</option>` + years.map(y => `<option value="${y}"${y === curY ? " selected" : ""}>${y}년</option>`).join("");
  $("kindList").innerHTML = Array.from(new Set(KINDS.concat(kinds))).map(k => `<option value="${esc(k)}">`).join("");
}
function renderList(){
  renderFilters();
  const el = $("mlist"), ms = filtered();
  if(!S.list.length){ el.innerHTML = `<div class="card empty">아직 작성된 회의록이 없습니다.${canWrite() ? "<br>‘+ 새 회의록’을 눌러 첫 회의록을 작성해 보세요." : ""}</div>`; return; }
  if(!ms.length){ el.innerHTML = `<div class="card empty">조건에 맞는 회의록이 없습니다.</div>`; return; }
  el.innerHTML = ms.map(m => {
    const [y, mo, d] = String(m.date || "").split("-");
    return `<button class="mcard" data-id="${esc(m.id)}" type="button">
      <span class="mdate">${y ? `${Number(mo)}월 ${Number(d)}일<small>${y}년${m.start ? " · " + esc(m.start) : ""}</small>` : "—"}</span>
      <span style="min-width:0">
        <span class="mmeta">${m.kind ? `<span class="tag kind">${esc(m.kind)}</span>` : ""}${esc(m.place || "")}${m.photoCount ? `<span class="tag">사진 ${m.photoCount}</span>` : ""}</span>
        <div class="mtopic">${esc(firstLine(m.summary) || firstLine(m.body)) || '<span style="color:var(--ink-faint)">내용 없음</span>'}</div>
      </span>
      <span class="mside">${esc(m.writer || m.createdByName || "")}</span>
    </button>`;
  }).join("");
}
["q", "fKindFilter", "fYear"].forEach(id => $(id).addEventListener("input", renderList));
$("mlist").addEventListener("click", e => {
  const b = e.target.closest(".mcard"); if(!b) return;
  const m = S.list.find(x => x.id === b.dataset.id); if(m) openEditor(m);
});
$("btnNew").addEventListener("click", () => openEditor(null));

/* =========================================================================
   작성·조회
   ========================================================================= */
const FIELDS = { kind:"fKind", date:"fDate", start:"fStart", end:"fEnd", place:"fPlace", writer:"fWriter",
                 attendees:"fAtt", summary:"fSummary", body:"fBody" };
function blank(){
  return { id:null, kind:"", date:today(), start:"", end:"", place:"", writer:S.name, attendees:"",
           summary:"", body:"" };
}
async function openEditor(m){
  S.cur = m ? JSON.parse(JSON.stringify(m)) : blank();
  S.cur._rm = [];
  S.photos = []; S.dirty = false;
  Object.entries(FIELDS).forEach(([k, id]) => { $(id).value = S.cur[k] || ""; });
  $("edTitle").textContent = m ? (m.kind || "회의록") + " · " + dateLabel(m).split(" ").slice(0, 3).join(" ") : "새 회의록";
  $("btnDel").hidden = !m || !canDelete();
  $("btnSave").hidden = !canWrite();
  $("pickers").hidden = !canWrite();
  $("phHint").hidden = !canWrite();
  renderPhotos();
  showView("edit");
  growAll();
  if(m && m.id){
    $("busy").textContent = m.photoCount ? "사진 불러오는 중…" : "";
    try{
      const s = await db.collection(`mt_minutes/${m.id}/photos`).orderBy("order").get();
      if(S.cur && S.cur.id === m.id){
        S.photos = s.docs.map(d => ({ id:d.id, data:d.data().data, cap:d.data().cap || "", cap0:d.data().cap || "" }));
        renderPhotos();
      }
    }catch(e){ console.warn(e); }
    $("busy").textContent = "";
  }
}
function collect(){
  const c = Object.assign({}, S.cur);
  Object.entries(FIELDS).forEach(([k, id]) => { c[k] = $(id).value.trim(); });
  return c;
}
function grow(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
function growAll(){ requestAnimationFrame(() => document.querySelectorAll("#v-edit textarea").forEach(grow)); }
$("v-edit").addEventListener("input", e => {
  if(e.target.matches("input,textarea")) S.dirty = true;
  if(e.target.tagName === "TEXTAREA") grow(e.target);
  const cap = e.target.closest("[data-cap]");
  if(cap){ S.photos[Number(cap.dataset.cap)].cap = cap.value; }
});

/* ---------- 사진 ---------- */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이미지를 읽지 못했습니다")); };
    img.src = url;
  });
}
function toJpeg(img, max, q){
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.naturalWidth * r); cv.height = Math.round(img.naturalHeight * r);
  const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
  g.drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", q);
}
async function addFiles(files){
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  for(const f of list){
    if(S.photos.length >= MAX_PHOTOS){ alert(`사진은 회의록 1건에 ${MAX_PHOTOS}장까지 넣을 수 있습니다.`); break; }
    try{
      const img = await loadImage(f);
      let data = toJpeg(img, 1400, 0.72);
      if(data.length > 700000) data = toJpeg(img, 1100, 0.6);
      S.photos.push({ id:null, data, cap:"" }); S.dirty = true;
    }catch(e){ alert(`${f.name}: 이미지를 읽지 못했습니다.`); }
  }
  renderPhotos();
}
["inCam", "inFile"].forEach(id => $(id).addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; }));
function renderPhotos(){
  const w = canWrite();
  $("phCount").textContent = S.photos.length ? `${S.photos.length}장` : "";
  $("photos").innerHTML = S.photos.length ? S.photos.map((p, i) => `<div class="ph">
      <img src="${p.data}" data-i="${i}" alt="관련사진 ${i + 1}">
      ${!p.id ? '<span class="new">저장 전</span>' : ""}
      ${w ? `<button class="x" type="button" data-rm="${i}" title="사진 빼기">×</button>` : ""}
      <input data-cap="${i}" value="${esc(p.cap)}" placeholder="사진 설명" ${w ? "" : "readonly"}>
    </div>`).join("") : (w ? "" : `<div class="hint">첨부된 사진이 없습니다.</div>`);
}
$("photos").addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if(rm){
    const p = S.photos.splice(Number(rm.dataset.rm), 1)[0];
    if(p.id) S.cur._rm.push(p.id);
    S.dirty = true; renderPhotos(); return;
  }
  const img = e.target.closest("img[data-i]"); if(img){ $("lbImg").src = img.src; $("lb").hidden = false; }
});
$("lb").addEventListener("click", () => { $("lb").hidden = true; });

/* ---------- 저장 · 삭제 ---------- */
$("btnSave").addEventListener("click", async () => {
  const c = collect();
  if(!c.date){ alert("일자를 입력해 주세요."); return; }
  if(!c.kind){ alert("회의종류를 입력해 주세요."); return; }
  const btn = $("btnSave"); btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const now = iso(), who = { updatedAt:now, updatedBy:S.user.uid, updatedByName:S.name };
    const ref = c.id ? db.collection("mt_minutes").doc(c.id) : db.collection("mt_minutes").doc();
    const doc = { kind:c.kind, date:c.date, start:c.start, end:c.end, place:c.place, writer:c.writer,
                  attendees:c.attendees, summary:c.summary, body:c.body,
                  photoCount:S.photos.length, ...who };
    if(!c.id){ Object.assign(doc, { createdAt:now, createdBy:S.user.uid, createdByName:S.name }); await ref.set(doc); }
    else await ref.update(doc);
    // 사진: 빠진 것 삭제 → 새 사진 추가 → 순서·설명 갱신
    await Promise.all(c._rm.map(id => ref.collection("photos").doc(id).delete()));
    for(let i = 0; i < S.photos.length; i++){
      const p = S.photos[i];
      if(!p.id){
        const pr = ref.collection("photos").doc();
        await pr.set({ data:p.data, cap:p.cap || "", order:i, createdAt:iso() });
        p.id = pr.id; p.cap0 = p.cap;
      }else{
        await ref.collection("photos").doc(p.id).update({ order:i, cap:p.cap || "" });
        p.cap0 = p.cap;
      }
    }
    S.cur = Object.assign({ id:ref.id }, S.cur, doc, { id:ref.id, _rm:[] });
    S.dirty = false;
    renderPhotos();
    $("btnDel").hidden = !canDelete();
    $("edTitle").textContent = (c.kind || "회의록") + " · " + dateLabel(c).split(" ").slice(0, 3).join(" ");
    btn.textContent = "저장됨 ✓";
    setTimeout(() => { btn.textContent = "저장"; btn.disabled = false; }, 1200);
  }catch(e){
    console.warn(e); btn.disabled = false; btn.textContent = "저장";
    alert(e && e.code === "permission-denied" ? "저장 권한이 없습니다. Firestore 규칙(mt_minutes)을 확인해 주세요." :
          "저장하지 못했습니다. " + (/size|exceed/i.test(String(e && e.message)) ? "사진 용량이 너무 큽니다." : "잠시 후 다시 시도해 주세요."));
  }
});
$("btnDel").addEventListener("click", async () => {
  const c = S.cur; if(!c || !c.id) return;
  if(!confirm("이 회의록을 삭제할까요? 사진도 함께 지워지며 되돌릴 수 없습니다.")) return;
  try{
    const ps = await db.collection(`mt_minutes/${c.id}/photos`).get();
    await Promise.all(ps.docs.map(d => d.ref.delete()));
    await db.collection("mt_minutes").doc(c.id).delete();
    S.dirty = false; S.cur = null; showView("list");
  }catch(e){ console.warn(e); alert("삭제하지 못했습니다."); }
});

/* =========================================================================
   인쇄 / PDF — 원본 양식과 같은 배치(흑백 표, 제목 칸 하늘색)
   ========================================================================= */
const B = "border:1px solid #000;padding:6px 8px;vertical-align:middle;";
const HEAD = "background:#dde8f4;text-align:center;font-weight:bold;letter-spacing:2px;";
function nl(s){ return esc(s).replace(/\n/g, "<br>"); }
function formHtml(m, photos){
  const ph = photos.length
    ? `<div style="display:grid;grid-template-columns:${photos.length === 1 ? "1fr" : "1fr 1fr"};gap:8px">${photos.map(p =>
        `<div style="break-inside:avoid;text-align:center"><img src="${p.data}" style="width:100%;max-height:${photos.length === 1 ? "95mm" : "62mm"};object-fit:contain;display:block;margin:0 auto">${p.cap ? `<div style="font-size:9pt;margin-top:3px">${esc(p.cap)}</div>` : ""}</div>`).join("")}</div>`
    : "";
  return `<div style="font-family:'맑은 고딕','Malgun Gothic',sans-serif;color:#000;font-size:10pt">
  <table style="width:100%;border-collapse:collapse;margin-bottom:12px;table-layout:fixed"><tr>
    <td style="width:52%;text-align:center;font-size:20pt;font-weight:bold;letter-spacing:3px;padding-right:10px">업무협의 회의록</td>
    <td style="padding:0">
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.5pt">
        <tr><td rowspan="2" style="${B}${HEAD}width:9%;padding:2px;line-height:2">결<br>재</td>
          ${["작 성","검 토","확 인","승 인"].map(t => `<td style="${B}${HEAD}padding:2px">${t}</td>`).join("")}</tr>
        <tr style="height:52px">${[0,1,2,3].map(() => `<td style="${B}"></td>`).join("")}</tr>
      </table>
    </td></tr></table>
  <table style="width:100%;border-collapse:collapse;table-layout:fixed">
    <colgroup><col style="width:13.3%"><col style="width:49.4%"><col style="width:11%"><col style="width:26.3%"></colgroup>
    <tr style="height:34px"><td style="${B}${HEAD}">회의종류</td><td style="${B}">${esc(m.kind || "")}</td><td style="${B}${HEAD}">일 시</td><td style="${B}font-size:9.5pt">${esc(dateLabel(m))}</td></tr>
    <tr style="height:34px"><td rowspan="2" style="${B}${HEAD}">참 석 자</td><td rowspan="2" style="${B}">${nl(m.attendees || "")}</td><td style="${B}${HEAD}">작 성 자</td><td style="${B}">${esc(m.writer || "")}</td></tr>
    <tr style="height:34px"><td style="${B}${HEAD}">장 소</td><td style="${B}">${esc(m.place || "")}</td></tr>
    <tr style="height:150px"><td style="${B}${HEAD}">주요내용</td><td colspan="3" style="${B}vertical-align:middle;line-height:1.6">${nl(m.summary || "")}</td></tr>
    <tr style="height:${photos.length ? 280 : 380}px"><td style="${B}${HEAD}">내 용</td><td colspan="3" style="${B}vertical-align:top;line-height:1.6">${nl(m.body || "")}</td></tr>
    <tr style="height:${photos.length ? 0 : 230}px"><td style="${B}${HEAD}">관련사진</td><td colspan="3" style="${B}padding:8px">${ph}</td></tr>
  </table></div>`;
}
$("btnPrint").addEventListener("click", () => {
  $("printArea").innerHTML = `<div class="pg">${formHtml(collect(), S.photos)}</div>`;
  const imgs = Array.from($("printArea").querySelectorAll("img"));
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => setTimeout(() => window.print(), 60));
});

function xmlEsc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ""); }
function rid(){ return String(Math.floor(1e9 + Math.random() * 1e9)); }
// tc 블록 안의 문단을 text(여러 줄)로 바꿈 — 문단 서식(paraPrIDRef)은 원래 칸의 것을 그대로 사용
function fillCell(tc, text){
  const m = tc.match(/<hp:subList[^>]*>([\s\S]*?)<\/hp:subList>/); if(!m) return tc;
  const pp = (m[1].match(/paraPrIDRef="(\d+)"/) || [])[1] || "0";
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  const paras = lines.map(l => `<hp:p id="${rid()}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">` +
    (l ? `<hp:run charPrIDRef="1"><hp:t>${xmlEsc(l)}</hp:t></hp:run>` : `<hp:run charPrIDRef="1"/>`) + `</hp:p>`).join("");
  return tc.replace(m[1], () => paras);
}
function fillSection(xml, m, photoCount){
  const tblStarts = []; xml.replace(/<hp:tbl /g, (s, i) => { tblStarts.push(i); return s; });
  const want = {
    // [표 번호, 열, 행] → 내용  (결재란은 출력 후 서명하도록 비워 둠)
    "1,1,0": m.kind, "1,3,0": dateLabel(m), "1,1,1": m.attendees, "1,3,1": m.writer, "1,3,2": m.place,
    "1,1,3": m.summary, "1,1,4": m.body,
    "1,1,5": photoCount ? `※ 관련사진 ${photoCount}매 — 안전관리 툴박스 회의록에 원본 보관 (사진 포함본은 인쇄/PDF 출력)` : ""
  };
  const middle = { "1,1,3":1 };   // 주요내용 칸은 위아래 가운데 정렬
  // 제목: 양식 원본의 '회   의   록' → '업무협의 회의록' (줄 배치 정보는 지워 한글이 다시 계산하게 함)
  xml = xml.replace(/<hp:t>회   의   록<\/hp:t><\/hp:run><hp:linesegarray>[\s\S]*?<\/hp:linesegarray>/, "<hp:t>업무협의 회의록</hp:t></hp:run>");
  return xml.replace(/<hp:tc [\s\S]*?<\/hp:tc>/g, (tc, pos) => {
    let t = 0; tblStarts.forEach((s, i) => { if(pos > s) t = i; });
    const a = tc.match(/<hp:cellAddr colAddr="(\d+)" rowAddr="(\d+)"\/>/); if(!a) return tc;
    const key = `${t},${a[1]},${a[2]}`;
    if(middle[key]) tc = tc.replace(/(<hp:subList[^>]*?)vertAlign="TOP"/, '$1vertAlign="CENTER"');
    return (key in want && want[key]) ? fillCell(tc, want[key]) : tc;
  });
}
async function buildHwpx(m, photoCount){
  const bin = atob(HWPX_TEMPLATE), u8 = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const zip = await JSZip.loadAsync(u8);
  const sec = await zip.file("Contents/section0.xml").async("string");
  zip.file("Contents/section0.xml", fillSection(sec, m, photoCount));
  const prv = ["업무협의 회의록", m.kind, dateLabel(m), m.place, m.summary].filter(Boolean).join("\n").slice(0, 1000);
  zip.file("Preview/PrvText.txt", prv);
  zip.file("mimetype", "application/hwp+zip", { compression:"STORE" });
  return zip.generateAsync({ type:"blob", mimeType:"application/hwp+zip", compression:"DEFLATE" });
}
window.__mtBuildHwpx = buildHwpx;   // (점검용)
$("btnHwpx").addEventListener("click", async () => {
  if(typeof JSZip === "undefined"){ alert("한글 파일 만들기 도구를 불러오지 못했습니다. 네트워크를 확인해 주세요."); return; }
  const m = collect(), btn = $("btnHwpx"); btn.disabled = true;
  try{
    const blob = await buildHwpx(m, S.photos.length);
    const name = `회의록_${(m.date || "").replace(/-/g, "")}_${(m.kind || "회의").replace(/[\\/:*?"<>|\s]+/g, "")}.hwpx`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }catch(e){ console.warn(e); alert("한글 파일을 만들지 못했습니다."); }
  btn.disabled = false;
});

/* =========================================================================
   시작
   ========================================================================= */
async function init(){
  if(!SA || !SA.configured() || !SA.boot()){ banner("Firebase 설정이 없어 이 도구를 사용할 수 없습니다. (firebase-config.js 확인)"); return; }
  const user = await new Promise(res => { const off = SA.auth.onAuthStateChanged(u => { off(); res(u); }); });
  if(!user) return;
  let prof = {};
  try{ const s = await SA.db.collection("users").doc(user.uid).get(); prof = s.exists ? s.data() : {}; }catch(e){}
  S.user = user; S.role = prof.role || "pending"; S.lv = SA.level(S.role, "mt");
  S.name = prof.name || user.displayName || (user.email || "").split("@")[0];
  if(!S.lv) return;
  db = SA.db;
  $("roleBadge").textContent = (SA.ROLE_LABELS[S.role] || "") + (S.lv === "read" ? " · 조회 전용" : "");
  $("btnNew").hidden = !canWrite();
  db.collection("mt_minutes").orderBy("date", "desc").limit(1000).onSnapshot(s => {
    S.list = s.docs.map(d => ({ id:d.id, ...d.data() }))
      .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.start || "").localeCompare(String(a.start || "")));
    banner(""); renderList();
  }, onErr);
}
window.addEventListener("beforeunload", e => { if(S.dirty){ e.preventDefault(); e.returnValue = ""; } });
init();
})();
</script>
