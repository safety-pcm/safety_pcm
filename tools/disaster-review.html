<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>중대재해 이행점검 서류심사</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#16212B; --ink-soft:#4B5A68; --ink-faint:#7C8A99;
  --paper:#EEF3F4; --surface:#FFFFFF; --surface-2:#F5F8F9;
  --border:#D7DEE1; --border-soft:#E5EAEC;
  --accent:#1D5673; --accent-ink:#ffffff; --accent-soft:#E3EDF1; --accent-strong:#0F3A4F;
  --good:#1E8A5F; --good-soft:#E4F3EC;
  --mid:#B8790E; --mid-soft:#FBF0DC;
  --low:#C0392B; --low-soft:#FBE7E4;
  --na:#7C8A99; --na-soft:#EEF1F3;
  --shadow: 0 1px 2px rgba(22,33,43,.06), 0 4px 14px rgba(22,33,43,.06);
  --radius: 10px;
  --thumb-size: 96px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EDF0; --ink-soft:#A8B6C0; --ink-faint:#7C8996;
    --paper:#0E1417; --surface:#161E22; --surface-2:#1C252A;
    --border:#2B363C; --border-soft:#233036;
    --accent:#7EC1E0; --accent-ink:#0B222C; --accent-soft:#1B323C; --accent-strong:#9AD2EC;
    --good:#4FC191; --good-soft:#15302A;
    --mid:#E3AC49; --mid-soft:#382C14;
    --low:#E27A6E; --low-soft:#37201D;
    --na:#8C99A3; --na-soft:#212B30;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EDF0; --ink-soft:#A8B6C0; --ink-faint:#7C8996;
  --paper:#0E1417; --surface:#161E22; --surface-2:#1C252A;
  --border:#2B363C; --border-soft:#233036;
  --accent:#7EC1E0; --accent-ink:#0B222C; --accent-soft:#1B323C; --accent-strong:#9AD2EC;
  --good:#4FC191; --good-soft:#15302A;
  --mid:#E3AC49; --mid-soft:#382C14;
  --low:#E27A6E; --low-soft:#37201D;
  --na:#8C99A3; --na-soft:#212B30;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans KR', 'Noto Sans KR', -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{ font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
input,textarea{ font-family:inherit; color:inherit; }
::selection{ background:var(--accent-soft); }
a{ color:var(--accent-strong); }

/* ---------- header ---------- */
.topbar{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--border); box-shadow:var(--shadow);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:14px 20px 0;
}
.brand{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.brand h1{ font-size:19px; font-weight:700; margin:0; letter-spacing:-.01em; }
.brand .sub{ font-size:12.5px; color:var(--ink-faint); }
.save-badge{
  margin-left:auto; font-size:11.5px; padding:3px 9px; border-radius:999px;
  border:1px solid var(--border); color:var(--ink-faint); white-space:nowrap;
}
.save-badge.live{ color:var(--good); border-color:var(--good-soft); background:var(--good-soft); }
.brand-row{ display:flex; align-items:center; gap:10px; }
.period-select{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  border-radius:7px; padding:6px 9px; font-size:12.5px; font-weight:600; cursor:pointer;
  font-family:inherit;
}

.tabs{
  display:flex; gap:4px; overflow-x:auto; margin-top:12px; padding-bottom:0;
  scrollbar-width:thin;
}
.tab{
  flex:0 0 auto; display:flex; align-items:center; gap:7px;
  padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  border:none; background:none; border-bottom:2.5px solid transparent; cursor:pointer;
  white-space:nowrap;
}
.tab:hover{ color:var(--ink); }
.tab.active{ color:var(--accent-strong); border-bottom-color:var(--accent); }
.tab .pct{
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:1px 6px; border-radius:999px; background:var(--surface-2); color:var(--ink-faint);
}
.tab .pct.band-good{ background:var(--good-soft); color:var(--good); }
.tab .pct.band-mid{ background:var(--mid-soft); color:var(--mid); }
.tab .pct.band-low{ background:var(--low-soft); color:var(--low); }
.tab.tab-add{
  border:1.5px dashed var(--border); border-radius:999px; padding:6px 13px; margin:4px 0;
  color:var(--ink-faint); align-self:center;
}
.tab.tab-add:hover{ border-color:var(--accent); color:var(--accent-strong); }

.wrap{ max-width:1180px; margin:0 auto; padding:20px; }

/* ---------- dashboard ---------- */
.dash-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:22px;
}
.site-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
  display:flex; flex-direction:column; gap:10px;
}
.site-card:hover{ border-color:var(--accent); }
.site-card .name{ font-weight:700; font-size:15px; }
.site-card .meta{ font-size:12px; color:var(--ink-faint); }
.gauge-row{ display:flex; align-items:center; gap:12px; }
.gauge-num{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; }
.gauge-bar{ flex:1; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.gauge-bar > i{ display:block; height:100%; border-radius:999px; }
.progress-line{ font-size:11.5px; color:var(--ink-faint); }

.section-title-row{
  display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 10px;
}
.section-title-row h2{ font-size:15px; margin:0; font-weight:700; }
.section-title-row .hint{ font-size:12px; color:var(--ink-faint); }

.dash-title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.dash-title-row h2{ font-size:19px; margin:0; font-weight:700; letter-spacing:-.01em; }
.dash-title-row .hint{ font-size:12.5px; color:var(--ink-faint); }

.chart-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 18px 8px; overflow-x:auto; margin-bottom:22px;
}
.chart-empty{ color:var(--ink-faint); font-size:13px; padding:24px; text-align:center; }

.matrix-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
table.matrix{ border-collapse:collapse; width:100%; font-size:12.5px; min-width:760px; }
table.matrix th, table.matrix td{ padding:8px 10px; border-bottom:1px solid var(--border-soft); text-align:center; }
table.matrix th{ text-align:left; color:var(--ink-faint); font-weight:600; font-size:11.5px; background:var(--surface-2); position:sticky; top:0; }
table.matrix td.rowhead{ text-align:left; font-weight:600; }
table.matrix tr:last-child td{ border-bottom:none; }
.cell-pct{
  display:inline-block; min-width:42px; padding:3px 6px; border-radius:6px;
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11.5px;
}
.cell-pct.band-good{ background:var(--good-soft); color:var(--good); }
.cell-pct.band-mid{ background:var(--mid-soft); color:var(--mid); }
.cell-pct.band-low{ background:var(--low-soft); color:var(--low); }
.cell-pct.band-empty{ background:var(--surface-2); color:var(--ink-faint); }

/* ---------- site view ---------- */
.site-header{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px; display:flex; gap:24px; flex-wrap:wrap; align-items:center;
  margin-bottom:16px;
}
.ring-wrap{ position:relative; width:96px; height:96px; flex:0 0 auto; }
.ring-wrap svg{ width:96px; height:96px; transform:rotate(-90deg); }
.ring-wrap .ring-num{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px;
}
.site-fields{ display:flex; flex-direction:column; gap:8px; flex:1 1 260px; min-width:220px; }
.field-row{ display:flex; gap:8px; flex-wrap:wrap; }
.field{ display:flex; flex-direction:column; gap:3px; }
.field label{ font-size:10.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em; }
.field input{
  border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:13px;
  background:var(--surface-2); color:var(--ink); min-width:0;
}
.field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
#field-name{ font-weight:700; font-size:15px; min-width:150px; }
.site-stats{ display:flex; gap:22px; flex-wrap:wrap; margin-left:auto; }
.stat{ text-align:right; }
.stat .v{ font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; }
.stat .l{ font-size:10.5px; color:var(--ink-faint); }
.print-btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
  border-radius:7px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.print-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
.danger-btn{ color:var(--low); border-color:var(--low-soft); background:var(--low-soft); }
.danger-btn.danger-armed{ background:var(--low); border-color:var(--low); color:#fff; }

.chip-nav{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 14px; }
.chip{
  flex:0 0 auto; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:5px 11px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.chip .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; vertical-align:middle; }

details.section-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:10px; overflow:hidden; scroll-margin-top:190px;
}
details.section-card > summary{
  list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; gap:12px;
}
details.section-card > summary::-webkit-details-marker{ display:none; }
.sec-chevron{ transition:transform .15s; color:var(--ink-faint); flex:0 0 auto; }
details[open] > summary .sec-chevron{ transform:rotate(90deg); }
.sec-heading{ flex:1; min-width:0; }
.sec-heading .num{ color:var(--accent-strong); font-weight:700; }
.sec-heading .t{ font-weight:600; font-size:13.8px; }
.sec-heading .ref{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
.sec-subtotal{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.sec-bar{ width:76px; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.sec-bar > i{ display:block; height:100%; }
.sec-num-lbl{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; min-width:70px; text-align:right; }

.item{ padding:14px 16px; border-top:1px solid var(--border-soft); display:flex; flex-direction:column; gap:9px; }
.item-head{ display:flex; gap:10px; align-items:flex-start; }
.item-no{
  flex:0 0 auto; width:22px; height:22px; border-radius:6px; background:var(--surface-2); color:var(--ink-faint);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:1px;
}
.item-crit{ font-size:13.3px; line-height:1.55; white-space:pre-wrap; flex:1; }
.item-method{ font-size:11.5px; color:var(--ink-faint); white-space:pre-wrap; line-height:1.5; padding-left:32px; }
.rate-row{ display:flex; gap:6px; flex-wrap:wrap; padding-left:32px; }
.rate-btn{
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  border-radius:7px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.rate-btn[data-val="good"].active{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
.rate-btn[data-val="mid"].active{ background:var(--mid-soft); border-color:var(--mid); color:var(--mid); }
.rate-btn[data-val="low"].active{ background:var(--low-soft); border-color:var(--low); color:var(--low); }
.rate-btn[data-val="na"].active{ background:var(--na-soft); border-color:var(--na); color:var(--na); }
.item-score{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-faint); padding-left:2px; align-self:center; margin-left:2px; }
.note-wrap{ padding-left:32px; }
.note-wrap textarea{
  width:100%; resize:vertical; min-height:40px; border:1px solid var(--border); border-radius:7px;
  padding:8px 10px; font-size:12.5px; background:var(--surface-2); color:var(--ink);
}
.note-wrap textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; background:var(--surface); }
.note-wrap textarea::placeholder{ color:var(--ink-faint); }

.photo-wrap{ padding-left:32px; }
.photo-strip{ display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px; }
.photo-slot{
  width:calc(var(--thumb-size) * 2); border-radius:9px; overflow:hidden; flex:0 0 auto;
  border:1px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column;
  transition:width .15s;
}
.photo-slot.empty{
  align-items:center; justify-content:center; height:calc(var(--thumb-size) * 1.15);
  border:1.5px dashed var(--border); background:var(--surface-2); color:var(--ink-faint);
  cursor:pointer; transition:width .15s, height .15s;
}
.photo-slot.empty:hover{ border-color:var(--accent); color:var(--accent-strong); }
.photo-slot.empty .slot-plus{ font-size:24px; line-height:1; }
.slot-caption-input{
  display:block; width:100%; border:none; background:var(--accent-strong); color:#fff;
  font-weight:700; font-size:11.5px; text-align:center; padding:7px 8px; letter-spacing:.01em;
}
.slot-caption-input::placeholder{ color:rgba(255,255,255,.68); font-weight:600; }
.slot-caption-input:focus{ outline:2px solid rgba(255,255,255,.55); outline-offset:-2px; }
.slot-grid{ display:grid; gap:2px; height:calc(var(--thumb-size) * 1.2); background:var(--border); transition:height .15s; }
.slot-grid.n1{ grid-template-columns:1fr; }
.slot-grid.n2{ grid-template-columns:1fr 1fr; }
.slot-grid.n3{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.slot-grid.n3 .slot-cell:first-child{ grid-column:1 / span 2; }
.slot-cell{ position:relative; overflow:hidden; background:var(--surface-2); }
.slot-cell img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
.photo-del-btn{
  position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; border:none;
  background:rgba(0,0,0,.62); color:#fff; font-size:12px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0; z-index:2;
}
.slot-tools{ display:flex; border-top:1px solid var(--border); }
.slot-tools button{
  flex:1; border:none; background:var(--surface); color:var(--ink-faint); font-size:9.5px; font-weight:600;
  padding:4px 1px; cursor:pointer; line-height:1.2; border-right:1px solid var(--border); white-space:nowrap;
}
.slot-tools button:last-child{ border-right:none; }
.slot-tools button:hover:not(:disabled){ color:var(--accent-strong); background:var(--accent-soft); }
.slot-tools button:disabled{ opacity:.4; cursor:default; }
.print-btn:disabled{ opacity:.6; cursor:default; }

.photo-size-toggle{
  display:flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; flex:0 0 auto;
}
.photo-size-toggle button{
  border:none; background:var(--surface-2); color:var(--ink-faint); padding:8px 10px;
  font-size:11.5px; font-weight:700; cursor:pointer; border-left:1px solid var(--border);
}
.photo-size-toggle button:first-child{ border-left:none; }
.photo-size-toggle button.active{ background:var(--accent-soft); color:var(--accent-strong); }
.photo-size-toggle button:hover:not(.active){ color:var(--ink); }

.foot-note{ font-size:11.5px; color:var(--ink-faint); line-height:1.7; margin:26px 0 6px; }

/* ---------- lightbox ---------- */
.lightbox{
  position:fixed; inset:0; background:rgba(8,12,15,.9); z-index:200;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
}
.lightbox[hidden]{ display:none; }
.lightbox img{
  max-width:min(92vw,900px); max-height:70vh; border-radius:10px; object-fit:contain;
  box-shadow:0 20px 60px rgba(0,0,0,.5); background:#0b0f12;
}
.lb-close{
  position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:50%; border:none;
  background:rgba(255,255,255,.14); color:#fff; font-size:17px; cursor:pointer;
}
.lb-nav{
  position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%;
  border:none; background:rgba(255,255,255,.14); color:#fff; font-size:24px; cursor:pointer;
}
.lb-nav:disabled{ opacity:.25; cursor:default; }
.lb-prev{ left:14px; } .lb-next{ right:14px; }
.lb-footer{ margin-top:16px; display:flex; align-items:center; gap:18px; color:#D7DEE1; font-size:12.5px; }
.lb-del{
  border:1px solid rgba(255,255,255,.32); background:none; color:#F0A99E; border-radius:7px;
  padding:6px 13px; font-size:12px; cursor:pointer;
}
.lb-del:hover{ background:rgba(240,169,158,.12); }

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px); z-index:250;
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:9px;
  font-size:12.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  max-width:82vw; text-align:center; box-shadow:var(--shadow);
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- summary (종합의견) ---------- */
.summary-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px; margin-top:14px; margin-bottom:10px;
}
.summary-head{ display:flex; flex-direction:column; gap:2px; margin-bottom:10px; }
.summary-head h3{ margin:0; font-size:14.5px; font-weight:700; }
.summary-head .hint{ font-size:11.5px; color:var(--ink-faint); }
#field-summary{
  width:100%; min-height:96px; resize:vertical; border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; font-size:13px; line-height:1.65; background:var(--surface-2); color:var(--ink);
}
#field-summary:focus{ outline:2px solid var(--accent); outline-offset:1px; background:var(--surface); }
#field-summary::placeholder{ color:var(--ink-faint); }

/* ---------- modals (photo preview / pdf preview) ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,12,15,.62); z-index:220;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay[hidden]{ display:none; }
.modal-card{
  background:var(--surface); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.35);
  width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
}
.modal-card.modal-wide{ max-width:820px; }
.modal-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px 18px; border-bottom:1px solid var(--border-soft); flex:0 0 auto;
}
.modal-head h3{ margin:0; font-size:15px; font-weight:700; }
.modal-head .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; display:block; }
.modal-close{
  border:none; background:var(--surface-2); color:var(--ink-faint); width:30px; height:30px;
  border-radius:50%; font-size:15px; cursor:pointer; flex:0 0 auto;
}
.modal-close:hover{ color:var(--ink); }
.modal-body{ padding:16px 18px; overflow-y:auto; flex:1 1 auto; background:var(--paper); }
.modal-actions{
  display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border-soft); flex:0 0 auto;
}
.btn-secondary{
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  border-radius:7px; padding:8px 16px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.btn-secondary:hover{ border-color:var(--accent); color:var(--accent-strong); }
.btn-primary{

/* ====================== PERIODS (상반기/하반기) ====================== */
function buildPeriodOptions(){
  const y = new Date().getFullYear();
  const opts = [];
  [y-1, y, y+1].forEach(yr=>{
    opts.push({ key: yr+'-H1', label: yr+'년 상반기' });
    opts.push({ key: yr+'-H2', label: yr+'년 하반기' });
  });
  return opts;
}
const PERIOD_OPTIONS = buildPeriodOptions();
function defaultPeriodKey(){
  const now = new Date();
  return now.getFullYear()+'-'+((now.getMonth()+1)<=6 ? 'H1':'H2');
}
function periodLabel(key){
  const found = PERIOD_OPTIONS.find(p=>p.key===key);
  if(found) return found.label;
  const [y,h] = key.split('-');
  return y+'년 '+(h==='H1'?'상반기':'하반기');
}
function recKey(period, siteId){ return period+'__'+siteId; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function initFirebaseDb(){
  try{
    if(!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey){
      console.warn("firebase-config.js에 설정값이 없습니다. 저장 기능이 꺼진 상태로 동작합니다.");
      return null;
    }
    if(typeof firebase === "undefined"){
      console.warn("Firebase SDK를 불러오지 못했습니다.");
      return null;
    }
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    return firebase.firestore();
  }catch(e){ console.warn("Firebase 초기화 실패", e); return null; }
}
function browserSave({filename, data}){
  return new Promise(resolve=>{
    const blob = (data instanceof Blob) ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    resolve();
  });
}

/* ====================== SCORING ====================== */
function computeRecord(siteId){
  const data = recordData[recKey(currentPeriod, siteId)] || {};
  const sections = SECTIONS.map(sec => {
    let score=0, weight=0, answered=0;
    sec.items.forEach(it => {
      const rec = data[it.id];
      if(!rec || !rec.rating) return;
      answered++;
      if(rec.rating === 'na') return;
      weight += it.weight;
      score += rec.rating==='good' ? it.good : rec.rating==='mid' ? it.mid : it.low;
    });
    const pct = weight>0 ? (score/weight*100) : null;
    return { num:sec.num, title:sec.title, score, weight, pct, answered, total: sec.items.length };
  });
  const overall = sections.reduce((acc,s)=>({
    score: acc.score+s.score, weight: acc.weight+s.weight,
    answered: acc.answered+s.answered, total: acc.total+s.total
  }), {score:0, weight:0, answered:0, total:0});
  overall.pct = overall.weight>0 ? (overall.score/overall.weight*100) : null;
  return { sections, overall };
}

function band(pct){
  if(pct===null || pct===undefined) return 'empty';
  if(pct>=80) return 'good';
  if(pct>=60) return 'mid';
  return 'low';
}
function bandColorVar(b){
  return b==='good' ? 'var(--good)' : b==='mid' ? 'var(--mid)' : b==='low' ? 'var(--low)' : 'var(--ink-faint)';
}
function fmtPct(pct){ return pct===null||pct===undefined ? '—' : (Math.round(pct*10)/10).toFixed(1)+'%'; }
function siteName(siteId){ return (siteRegistry[siteId] && siteRegistry[siteId].name) || siteId; }

/* ====================== TOAST (replaces blocked alert()) ====================== */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 3600);
}

/* ====================== PERSISTENCE ====================== */
function buildItemRecord(period, siteId, id, overrides){
  const existing = (recordData[recKey(period,siteId)] && recordData[recKey(period,siteId)][id]) || {};
  const rec = {...existing, ...overrides};
  const clean = {};
  if(rec.rating) clean.rating = rec.rating;
  if(rec.note) clean.note = rec.note;
  return clean;
}

async function persist(period, siteId, patch){
  const key = recKey(period, siteId);
  recordData[key] = {...(recordData[key]||{}), ...patch};
  if(currentView===siteId && currentPeriod===period) syncSiteView(siteId);
  if(currentView==='dashboard' && currentPeriod===period) renderDashboard();
  renderTabs();
  if(!db) return;
  try{
    const ref = db.doc('records/'+key);
    if(recordExists[key]){
      await ref.update(patch);
    } else {
      await ref.set({...recordData[key]});
      recordExists[key] = true;
    }
  } catch(e){
    try{
      await db.doc('records/'+key).set({...recordData[key]});
      recordExists[key] = true;
    }catch(e2){ console.warn('저장 실패', key, e2); }
  }
}

function setRating(period, siteId, itemId, rating){
  const key = recKey(period, siteId);
  const cur = recordData[key] && recordData[key][itemId];
  const nextRating = (cur && cur.rating===rating) ? undefined : rating; // toggle off if same
  const rec = buildItemRecord(period, siteId, itemId, { rating: nextRating, note: cur ? cur.note : undefined });
  persist(period, siteId, { [itemId]: rec });
}

function setNote(period, siteId, itemId, note){
  const key = recKey(period, siteId);
  clearTimeout(noteTimers[key+':'+itemId]);
  noteTimers[key+':'+itemId] = setTimeout(()=>{
    const cur = recordData[key] && recordData[key][itemId];
    const rec = buildItemRecord(period, siteId, itemId, { rating: cur?cur.rating:undefined, note });
    persist(period, siteId, { [itemId]: rec });
  }, 500);
}

function setRecordField(period, siteId, field, value){
  const key = recKey(period, siteId);
  clearTimeout(noteTimers[key+':'+field]);
  recordData[key] = {...(recordData[key]||{}), [field]: value};
  renderTabs();
  if(currentView==='dashboard' && currentPeriod===period) renderDashboard();
  noteTimers[key+':'+field] = setTimeout(()=> persist(period, siteId, { [field]: value }), 400);
}

function setSiteName(siteId, value){
  siteRegistry[siteId] = {...(siteRegistry[siteId]||{}), name: value};
  renderTabs();
  if(currentView==='dashboard') renderDashboard();
  clearTimeout(noteTimers['name:'+siteId]);
  noteTimers['name:'+siteId] = setTimeout(async ()=>{
    if(!db) return;
    try{ await db.doc('siteRegistry/'+siteId).update({ name: value }); }
    catch(e){
      try{ await db.doc('siteRegistry/'+siteId).set({...siteRegistry[siteId]}); }
      catch(e2){ console.warn('현장명 저장 실패', e2); }
    }
  }, 400);
}

/* ====================== SITE ADD / REMOVE ====================== */
async function addSite(){
  if(siteOrder.length >= MAX_SITES){ toast(`현장은 최대 ${MAX_SITES}개까지 추가할 수 있습니다.`); return; }
  const newId = 'site_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const order = siteOrder.length;
  const name = `현장 ${order+1}`;
  siteRegistry[newId] = { name, order };
  siteOrder = [...siteOrder, newId];
  currentView = newId;
  renderMain();
  if(db){
    try{ await db.doc('siteRegistry/'+newId).set({ name, order, createdAt: new Date().toISOString() }); }
    catch(e){ console.warn('현장 추가 실패', e); toast('현장 추가 중 문제가 발생했습니다.'); }
  }
}

function removeSite(siteId){
  const btn = document.getElementById('removeSiteBtn');
  if(!btn) return;
  if(btn.dataset.armed !== '1'){
    btn.dataset.armed = '1';
    btn.dataset.label = btn.textContent;
    btn.textContent = '다시 누르면 삭제됩니다';
    btn.classList.add('danger-armed');
    setTimeout(()=>{
      if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.textContent = btn.dataset.label; btn.classList.remove('danger-armed'); }
    }, 3000);
    return;
  }
  delete siteRegistry[siteId];
  siteOrder = siteOrder.filter(id=>id!==siteId);
  currentView = 'dashboard';
  renderMain();
  toast('현장을 목록에서 제거했습니다. 이미 입력된 기록은 보존됩니다.');
  if(db){ db.doc('siteRegistry/'+siteId).delete().catch(e=>console.warn('현장 제거 실패', e)); }
}

/* ====================== PHOTOS ====================== */
const PHOTO_PRESETS = {
  small:  { maxDim:640,  quality:0.6  },
  medium: { maxDim:1100, quality:0.75 },
  large:  { maxDim:1600, quality:0.85 }
};
const PHOTO_SAFE_LEN = 250000; // keep well under the 256 KiB per-document cap

/* on-screen photo LAYOUT size (display size, not file weight/quality) */
const PHOTO_DISPLAY_PX = { small:72, medium:96, large:144 };
let photoDisplaySize = 'medium';
function applyPhotoDisplaySize(){
  document.documentElement.style.setProperty('--thumb-size', PHOTO_DISPLAY_PX[photoDisplaySize]+'px');
}
function setPhotoDisplaySize(size){
  if(!PHOTO_DISPLAY_PX[size]) return;
  photoDisplaySize = size;
  applyPhotoDisplaySize();
  document.querySelectorAll('#photoSizeToggle button[data-size]').forEach(b=>{
    b.classList.toggle('active', b.dataset.size===size);
  });
}

function compressImage(file, presetKey){
  const preset = PHOTO_PRESETS[presetKey] || PHOTO_PRESETS.medium;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.onload = ()=>{
        try{
          let {width, height} = img;
          const maxDim = preset.maxDim;
          if(width > maxDim || height > maxDim){
            if(width >= height){ height = Math.round(height*maxDim/width); width = maxDim; }
            else{ width = Math.round(width*maxDim/height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          let quality = preset.quality;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while(dataUrl.length > PHOTO_SAFE_LEN && quality > 0.25){
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataUrl);
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function genLocalId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* 항목당 미리 지정된 4개의 사진칸(슬롯). 한 칸에는 사진을 최대 3장까지 담을 수 있습니다. */
const MAX_PHOTO_SLOTS = 4;
const MAX_PHOTOS_PER_SLOT = 3;

async function addPhoto(period, siteId, itemId, file, presetKey, blockId){
  if(!file || file.type.indexOf('image/')!==0) return;
  let dataUrl;
  try{ dataUrl = await compressImage(file, presetKey); }
  catch(e){ console.warn('이미지 처리 실패', e); toast('사진을 처리하지 못했습니다.'); return; }

  const key = recKey(period, siteId);
  const bId = blockId || genLocalId(); // 지정된 칸(blockId)이 있으면 그 칸에, 없으면 새 칸을 만들어 담음
  if(db){
    try{
      await db.doc('records/'+key).collection('photos').add({ itemId, data: dataUrl, createdAt: new Date().toISOString(), blockId: bId, fit:'cover', caption:'' });
      return; // live snapshot will refresh the UI
    }catch(e){ console.warn('사진 저장 실패', e); }
  }
  const photoId = 'local'+Date.now()+Math.random().toString(36).slice(2,8);
  recordPhotos[key] = [...(recordPhotos[key]||[]), { id: photoId, itemId, data: dataUrl, blockId: bId, fit:'cover', caption:'' }];
  if(currentView===siteId && currentPeriod===period) refreshPhotoThumbs(siteId);
}

async function deletePhoto(period, siteId, photoId){
  const key = recKey(period, siteId);
  if(db){
    try{ await db.doc('records/'+key).collection('photos').doc(photoId).delete(); return; }
    catch(e){ console.warn('사진 삭제 실패', e); }
  }
  recordPhotos[key] = (recordPhotos[key]||[]).filter(p=>p.id!==photoId);
  if(currentView===siteId && currentPeriod===period) refreshPhotoThumbs(siteId);
}

/* apply a small field patch to one photo doc (fit / blockId), optimistic local update first */
async function updatePhotoField(period, siteId, photoId, patch){
  const key = recKey(period, siteId);
  recordPhotos[key] = (recordPhotos[key]||[]).map(p=> p.id===photoId ? {...p, ...patch} : p);
  if(currentView===siteId && currentPeriod===period) refreshPhotoThumbs(siteId);
  if(db){
    try{ await db.doc('records/'+key).collection('photos').doc(photoId).update(patch); }
    catch(e){ console.warn('사진 정보 수정 실패', e); }
  }
}

/* 한 칸(blockId)에 담긴 사진 전체의 채움/여백맞춤을 함께 전환 */
function toggleSlotFit(period, siteId, blockId){
  const key = recKey(period, siteId);
  const photos = (recordPhotos[key]||[]).filter(p=>p.blockId===blockId);
  if(!photos.length) return;
  const nextFit = photos[0].fit==='contain' ? 'cover' : 'contain';
  photos.forEach(p=> updatePhotoField(period, siteId, p.id, { fit: nextFit }));
}

/* group an item's photos (in order) into 사진칸(블록) runs by blockId — a PDF frame per group, max 3 photos per frame */
function groupPhotosByBlock(photos){
  const groups = [];
  photos.forEach(p=>{
    const last = groups[groups.length-1];
    if(last && last.blockId===p.blockId && last.photos.length<3) last.photos.push(p);
    else groups.push({ blockId:p.blockId, photos:[p] });
  });
  return groups;
}

/* 설명(캡션)은 한 칸(blockId)의 모든 사진에 동일하게 적용. 타이핑 중에는 즉시 저장하지 않고
   500ms 동안 입력이 멈추면 저장 — 매 키 입력마다 서버 왕복이 생기지 않도록 함 */
const captionTimers = {};
function setSlotCaption(period, siteId, blockId, text){
  const key = recKey(period, siteId);
  recordPhotos[key] = (recordPhotos[key]||[]).map(p=> p.blockId===blockId ? {...p, caption:text} : p);
  if(!db) return;
  clearTimeout(captionTimers[blockId]);
  captionTimers[blockId] = setTimeout(async ()=>{
    const photos = (recordPhotos[key]||[]).filter(p=>p.blockId===blockId);
    for(const p of photos){
      try{ await db.doc('records/'+key).collection('photos').doc(p.id).update({ caption: text }); }
      catch(e){ console.warn('사진 설명 저장 실패', e); }
    }
  }, 500);
}

function photoSlotsHtml(period, siteId, itemId){
  const photos = (recordPhotos[recKey(period,siteId)]||[]).filter(p=>p.itemId===itemId);
  const groups = groupPhotosByBlock(photos);
  let html = '';
  for(let i=0; i<MAX_PHOTO_SLOTS; i++){
    const g = groups[i];
    if(!g){
      html += `<div class="photo-slot empty" data-slot-new="1" data-item="${itemId}" title="사진 추가"><span class="slot-plus">+</span></div>`;
      continue;
    }
    const shown = g.photos.slice(0,3);
    const n = shown.length;
    const cellsHtml = shown.map(p=>{
      const idx = photos.indexOf(p);
      return `
        <div class="slot-cell">
          <img src="${p.data}" data-item="${itemId}" data-index="${idx}" alt="증빙사진" style="object-fit:${p.fit==='contain'?'contain':'cover'}">
          <button class="photo-del-btn" data-photo="${p.id}" title="삭제">×</button>
        </div>`;
    }).join('');
    const fitLabel = shown[0].fit==='contain' ? '여백맞춤' : '꽉채움';
    const canAddMore = g.photos.length < MAX_PHOTOS_PER_SLOT;
    html += `
      <div class="photo-slot" data-block="${escapeAttr(g.blockId)}">
        <input type="text" class="slot-caption-input" data-block="${escapeAttr(g.blockId)}" placeholder="사진 설명 입력" value="${escapeAttr(shown[0].caption||'')}" maxlength="60">
        <div class="slot-grid n${n}">${cellsHtml}</div>
        <div class="slot-tools">
          <button class="tt-fit" data-block="${escapeAttr(g.blockId)}" title="사진을 꽉 채울지 여백을 두고 맞출지 전환">${fitLabel}</button>
          <button class="tt-addmore" data-block="${escapeAttr(g.blockId)}" data-item="${itemId}" ${canAddMore?'':'disabled'} title="${canAddMore?'이 칸에 사진 합치기 (최대 3장)':'이 칸은 최대 3장까지 담을 수 있습니다'}">사진 합치기</button>
        </div>
      </div>`;
  }
  return html;
}

function refreshPhotoThumbs(siteId){
  if(currentView !== siteId) return;
  ALL_ITEMS.forEach(it=>{
    const el = document.getElementById('photos-'+it.id);
    if(!el) return;
    /* 사진 설명을 입력 중이면 다시 그리지 않음 — 그리지 않아도 입력값은 이미 recordPhotos에 반영되어 있어 안전 */
    if(el.contains(document.activeElement) && document.activeElement.classList && document.activeElement.classList.contains('slot-caption-input')) return;
    el.innerHTML = photoSlotsHtml(currentPeriod, siteId, it.id);
  });
}

/* ====================== PHOTO PREVIEW MODAL ====================== */
let photoPreviewState = null; // { period, siteId, itemId, files, urls, preset, targetBlockId }

function openPhotoPreview(period, siteId, itemId, files, targetBlockId){
  if(!files || !files.length) return;
  if(photoPreviewState) photoPreviewState.urls.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });
  photoPreviewState = {
    period, siteId, itemId,
    files,
    urls: files.map(f=> URL.createObjectURL(f)),
    preset: 'medium',
    targetBlockId: targetBlockId || null
  };
  renderPhotoPreview();
  const modal = document.getElementById('photoPreviewModal');
  modal.hidden = false;
  const saveBtn = document.getElementById('ppmSaveBtn');
  saveBtn.disabled = false; saveBtn.textContent = '사진 저장';
}

function closePhotoPreview(){
  const modal = document.getElementById('photoPreviewModal');
  if(modal) modal.hidden = true;
  if(photoPreviewState){
    photoPreviewState.urls.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });
    photoPreviewState = null;
  }
}

function renderPhotoPreview(){
  if(!photoPreviewState) return;
  const grid = document.getElementById('ppmGrid');
  if(grid){
    grid.innerHTML = photoPreviewState.urls.map((u,i)=>`<div class="ppm-thumb"><img src="${u}" alt="사진 미리보기 ${i+1}"></div>`).join('');
  }
  const countEl = document.getElementById('ppmCount');
  if(countEl) countEl.textContent = `사진 ${photoPreviewState.files.length}장`;
  document.querySelectorAll('.ppm-size-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.preset===photoPreviewState.preset);
  });
}

function setPhotoPreviewPreset(preset){
  if(!photoPreviewState || !PHOTO_PRESETS[preset]) return;
  photoPreviewState.preset = preset;
  renderPhotoPreview();
}

async function confirmPhotoPreview(){
  if(!photoPreviewState) return;
  const { period, siteId, itemId, files, preset, targetBlockId } = photoPreviewState;
  const saveBtn = document.getElementById('ppmSaveBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = '저장 중…'; }

  const key = recKey(period, siteId);
  const existing = (recordPhotos[key]||[]).filter(p=>p.itemId===itemId);
  const groups = groupPhotosByBlock(existing);
  let blockId = targetBlockId;
  let capacity;
  if(blockId){
    const g = groups.find(x=>x.blockId===blockId);
    capacity = MAX_PHOTOS_PER_SLOT - (g ? g.photos.length : 0);
  } else {
    if(groups.length >= MAX_PHOTO_SLOTS){
      toast(`사진칸은 최대 ${MAX_PHOTO_SLOTS}개까지 만들 수 있습니다.`);
      closePhotoPreview();
      return;
    }
    blockId = genLocalId();
    capacity = MAX_PHOTOS_PER_SLOT;
  }
  const toSave = files.slice(0, Math.max(0,capacity));
  const skipped = files.length - toSave.length;
  for(const f of toSave){ await addPhoto(period, siteId, itemId, f, preset, blockId); }
  if(skipped > 0){ toast(`한 칸에는 사진을 최대 ${MAX_PHOTOS_PER_SLOT}장까지 담을 수 있어 ${skipped}장은 저장되지 않았습니다.`); }
  closePhotoPreview();
}

function wirePhotoPreviewModalOnce(){
  document.getElementById('ppmClose').addEventListener('click', closePhotoPreview);
  document.getElementById('ppmCancel').addEventListener('click', closePhotoPreview);
  document.getElementById('ppmSaveBtn').addEventListener('click', confirmPhotoPreview);
  document.getElementById('photoPreviewModal').addEventListener('click', (e)=>{ if(e.target.id==='photoPreviewModal') closePhotoPreview(); });
  document.querySelectorAll('.ppm-size-btn').forEach(b=>{
    b.addEventListener('click', ()=> setPhotoPreviewPreset(b.dataset.preset));
  });
  document.addEventListener('keydown', (e)=>{
    const modal = document.getElementById('photoPreviewModal');
    if(modal.hidden) return;
    if(e.key==='Escape') closePhotoPreview();
  });
}

/* ====================== LIGHTBOX ====================== */
function openLightbox(period, siteId, itemId, index){
  lightbox = { period, siteId, itemId, index };
  renderLightbox();
  document.getElementById('lightbox').hidden = false;
}
function closeLightbox(){ document.getElementById('lightbox').hidden = true; }
function renderLightbox(){
  const photos = (recordPhotos[recKey(lightbox.period, lightbox.siteId)]||[]).filter(p=>p.itemId===lightbox.itemId);
  if(!photos.length){ closeLightbox(); return; }
  if(lightbox.index >= photos.length) lightbox.index = photos.length-1;
  if(lightbox.index < 0) lightbox.index = 0;
  const p = photos[lightbox.index];
  document.getElementById('lbImg').src = p.data;
  document.getElementById('lbCount').textContent = `${lightbox.index+1} / ${photos.length}`;
  document.getElementById('lbPrev').disabled = lightbox.index<=0;
  document.getElementById('lbNext').disabled = lightbox.index>=photos.length-1;
  document.getElementById('lbDel').onclick = ()=>{ deletePhoto(lightbox.period, lightbox.siteId, p.id); closeLightbox(); };
}
function lightboxNav(delta){ lightbox.index += delta; renderLightbox(); }

function wireLightboxOnce(){
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', ()=> lightboxNav(-1));
  document.getElementById('lbNext').addEventListener('click', ()=> lightboxNav(1));
  document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') closeLightbox(); });
  document.addEventListener('keydown', (e)=>{
    const lb = document.getElementById('lightbox');
    if(lb.hidden) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowLeft') lightboxNav(-1);
    if(e.key==='ArrowRight') lightboxNav(1);
  });
}

/* which 사진칸(blockId)의 hidden file input을 통해 새 파일이 들어올지 기록해두는 상태값.
   null이면 빈 슬롯의 "+" — 새 칸을 만듦. 값이 있으면 그 칸에 사진을 합침(최대 3장). */
let pendingPhotoTargetBlockId = null;

/* delegated handler wired ONCE on the persistent #app node (avoids listener
   accumulation across re-renders, since innerHTML replaces children but not #app itself) */
function wireAppDelegationOnce(){
  const app = document.getElementById('app');
  app.addEventListener('click', (e)=>{
    if(currentView==='dashboard' || !siteRegistry[currentView]) return;
    const siteId = currentView;
    const period = currentPeriod;
    const slotImg = e.target.closest('.slot-cell img');
    if(slotImg){ openLightbox(period, siteId, slotImg.dataset.item, Number(slotImg.dataset.index)); return; }
    const emptySlot = e.target.closest('.photo-slot.empty');
    if(emptySlot){
      pendingPhotoTargetBlockId = null;
      const inp = document.getElementById('photoInput-'+emptySlot.dataset.item);
      if(inp) inp.click();
      return;
    }
    const addMoreBtn = e.target.closest('.tt-addmore');
    if(addMoreBtn){
      if(addMoreBtn.disabled) return;
      pendingPhotoTargetBlockId = addMoreBtn.dataset.block;
      const inp = document.getElementById('photoInput-'+addMoreBtn.dataset.item);
      if(inp) inp.click();
      return;
    }
    const delBtn = e.target.closest('.photo-del-btn');
    if(delBtn){ deletePhoto(period, siteId, delBtn.dataset.photo); return; }
    const fitBtn = e.target.closest('.tt-fit');
    if(fitBtn){ toggleSlotFit(period, siteId, fitBtn.dataset.block); return; }
  });
  app.addEventListener('input', (e)=>{
    if(currentView==='dashboard' || !siteRegistry[currentView]) return;
    const capInput = e.target.closest('.slot-caption-input');
    if(capInput){ setSlotCaption(currentPeriod, currentView, capInput.dataset.block, capInput.value); return; }
  });
}

/* ====================== RENDER: DASHBOARD ====================== */
function buildBarChartSvg(rows){
  if(!rows.length) return `<div class="chart-empty">비교할 현장이 없습니다. 현장을 추가해 주세요.</div>`;
  const rowH = 32, gap = 12, top = 26, labelW = 128, plotW = 380, rightPad = 56;
  const totalH = top + rows.length*(rowH+gap);
  const svgW = labelW + plotW + rightPad;
  const marks = [0,25,50,75,100];
  let grid = marks.map(v=>{
    const x = labelW + v/100*plotW;
    return `<line x1="${x}" y1="${top-12}" x2="${x}" y2="${totalH-gap+2}" style="stroke:var(--border-soft)" stroke-width="1"/>
      <text x="${x}" y="${top-16}" font-size="10" style="fill:var(--ink-faint)" text-anchor="middle" font-family="'IBM Plex Mono',monospace">${v}%</text>`;
  }).join('');
  let bars = rows.map((r,i)=>{
    const y = top + i*(rowH+gap);
    const b = band(r.pct);
    const colorVar = bandColorVar(b);
    const w = r.pct ? Math.min(100,r.pct)/100*plotW : 0;
    const label = r.name.length>11 ? r.name.slice(0,11)+'…' : r.name;
    return `
      <text x="${labelW-10}" y="${y+rowH/2+4}" font-size="12" style="fill:var(--ink)" text-anchor="end" font-weight="600">${escapeHtml(label)}</text>
      <rect x="${labelW}" y="${y}" width="${plotW}" height="${rowH}" rx="6" style="fill:var(--surface-2)"/>
      <rect x="${labelW}" y="${y}" width="${w}" height="${rowH}" rx="6" style="fill:${colorVar}"/>
      <text x="${labelW+w+10}" y="${y+rowH/2+4}" font-size="12" font-weight="700" style="fill:${colorVar}" font-family="'IBM Plex Mono',monospace">${r.pct===null?'미착수':Math.round(r.pct)+'%'}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${svgW} ${totalH}" style="width:100%; height:auto; max-width:640px; display:block;">${grid}${bars}</svg>`;
}

  const circumference = 2*Math.PI*40;
  const dash = overall.pct===null ? 0 : Math.min(100,overall.pct)/100*circumference;

  let chips = SECTIONS.map(sec=>{
    const s = sections.find(x=>x.num===sec.num);
    return `<button class="chip" data-jump="sec-${sec.num}"><span class="dot" style="background:${bandColorVar(band(s.pct))}"></span>${sec.num}. ${escapeHtml(sec.title.slice(0,14))}${sec.title.length>14?'…':''}</button>`;
  }).join('');

  let sectionsHtml = SECTIONS.map((sec,idx)=>{
    const s = sections.find(x=>x.num===sec.num);
    const sb = band(s.pct);
    let itemsHtml = sec.items.map(it=>{
      const rec = d[it.id] || {};
      const scored = rec.rating ? (rec.rating==='na'?null: rec.rating==='good'?it.good:rec.rating==='mid'?it.mid:it.low) : undefined;
      const scoreLabel = !rec.rating ? `배점 ${it.weight}점 · 미응답`
        : rec.rating==='na' ? `해당없음 (배점 제외)`
        : `배점 ${it.weight}점 · 획득 ${scored}점`;
      const buttons = [
        ['good','우수'], ...(it.twoOpt?[]:[['mid','보통']]), ['low','미흡'], ['na','해당없음']
      ].map(([val,label])=>`<button class="rate-btn" data-val="${val}" data-item="${it.id}">${label}</button>`).join('');
      return `
      <div class="item">
        <div class="item-head">
          <div class="item-no">${it.no}</div>
          <div class="item-crit">${escapeHtml(it.criteria)}</div>
        </div>
        <div class="item-method">${escapeHtml(it.method)}</div>

        <div class="note-wrap"><textarea id="note-${it.id}" data-item="${it.id}" placeholder="문제점 및 개선요청 사항 / 사진대지 메모">${escapeHtml(rec.note||'')}</textarea></div>
        <div class="photo-wrap">
          <div class="photo-strip" id="photos-${it.id}">${photoSlotsHtml(period, siteId, it.id)}</div>

        </div>
      </div>`;
    }).join('');

    return `
    <details class="section-card" id="sec-${sec.num}" ${idx===0?'open':''}>
      <summary>
        <svg class="sec-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="sec-heading">
          <span class="t"><span class="num">${sec.num}.</span> ${escapeHtml(sec.title)}</span>
          <div class="ref">${escapeHtml(sec.ref)}</div>
        </div>
        <div class="sec-subtotal">
          <div class="sec-bar"><i id="secbar-${sec.num}" style="width:${s.pct?Math.min(100,s.pct):0}%; background:${bandColorVar(sb)}"></i></div>
          <div class="sec-num-lbl" id="seclbl-${sec.num}">${s.score}/${s.weight}점 · ${fmtPct(s.pct)}</div>
        </div>
      </summary>
      ${itemsHtml}
    </details>`;
  }).join('');

  app.innerHTML = `
    <div class="site-header">
      <div class="ring-wrap">
        <svg viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="40" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
          <circle id="ringProgress" cx="48" cy="48" r="40" fill="none" stroke="${bandColorVar(b)}" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="${dash} ${circumference}"/>
        </svg>
        <div class="ring-num mono" id="ringNum" style="color:${bandColorVar(b)}">${overall.pct===null?'—':Math.round(overall.pct)+'%'}</div>
      </div>
      <div class="site-fields">
        <input id="field-name" value="${escapeAttr(siteName(siteId))}" placeholder="현장명" />
        <div class="field-row">
          <div class="field"><label>점검자</label><input id="field-inspector" value="${escapeAttr(d.inspector||'')}" placeholder="이름 / 직급" style="width:130px"></div>
          <div class="field"><label>점검일자</label><input id="field-date" type="date" value="${escapeAttr(d.date||'')}"></div>

        </div>
      </div>

        <div class="stat"><div class="v mono" id="statScore">${overall.score}/${overall.weight}</div><div class="l">획득점수/배점</div></div>
        <div class="stat"><div class="v mono" id="statAnswered">${overall.answered}/${TOTAL_ITEMS}</div><div class="l">응답 문항</div></div>
        <div class="photo-size-toggle" id="photoSizeToggle" title="사진 표시 크기">
          <button type="button" data-size="small" class="${photoDisplaySize==='small'?'active':''}">사진 작게</button>
          <button type="button" data-size="medium" class="${photoDisplaySize==='medium'?'active':''}">보통</button>
          <button type="button" data-size="large" class="${photoDisplaySize==='large'?'active':''}">크게</button>
        </div>
        <button class="print-btn" id="printBtn">PDF로 저장</button>
        <button class="print-btn danger-btn" id="removeSiteBtn" title="현장 목록에서 제거 (기존 점검 기록은 보존됩니다)">현장 제거</button>

    <div class="chip-nav">${chips}</div>
    ${sectionsHtml}

  `;

  app.querySelectorAll('.rate-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> setRating(period, siteId, btn.dataset.item, btn.dataset.val));
  });
  app.querySelectorAll('textarea[id^="note-"]').forEach(ta=>{

  });
  document.getElementById('field-name').addEventListener('input', e=> setSiteName(siteId, e.target.value));
  document.getElementById('field-inspector').addEventListener('input', e=> setRecordField(period, siteId,'inspector', e.target.value));
  document.getElementById('field-date').addEventListener('input', e=> setRecordField(period, siteId,'date', e.target.value));
  document.getElementById('field-summary').addEventListener('input', e=> setRecordField(period, siteId,'summary', e.target.value));
  document.getElementById('printBtn').addEventListener('click', ()=> openPdfPreview(period, siteId));
  document.getElementById('removeSiteBtn').addEventListener('click', ()=> removeSite(siteId));
  document.getElementById('photoSizeToggle').querySelectorAll('button[data-size]').forEach(b=>{
    b.addEventListener('click', ()=> setPhotoDisplaySize(b.dataset.size));
  });
  app.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      const target = document.getElementById(c.dataset.jump);
      if(target){ target.open = true; target.scrollIntoView({behavior:'smooth', block:'start'}); }
    });
  });

  app.querySelectorAll('input[id^="photoInput-"]').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const itemId = inp.id.replace('photoInput-','');
      const files = Array.from(e.target.files || []).filter(f=> f.type.indexOf('image/')===0);
      const targetBlockId = pendingPhotoTargetBlockId;
      pendingPhotoTargetBlockId = null;
      if(files.length) openPhotoPreview(period, siteId, itemId, files, targetBlockId);
      inp.value = '';
    });
  });

  syncSiteView(siteId);
}

/* incremental refresh: updates numbers/active states without rebuilding DOM (keeps focus in text inputs) */
function syncSiteView(siteId){
  if(currentView !== siteId) return;
  const period = currentPeriod;
  const d = recordData[recKey(period,siteId)] || {};
  const {sections, overall} = computeRecord(siteId);
  const b = band(overall.pct);

  const nameEl = document.getElementById('field-name');
  if(nameEl && document.activeElement!==nameEl){
    const val = siteName(siteId);
    if(nameEl.value !== val) nameEl.value = val;
  }
  [['field-inspector','inspector'], ['field-date','date']].forEach(([elId,f])=>{
    const el = document.getElementById(elId);
    if(el && document.activeElement!==el){
      const val = d[f] || '';
      if(el.value !== val) el.value = val;
    }
  });
  const summaryEl = document.getElementById('field-summary');
  if(summaryEl && document.activeElement!==summaryEl){
    const val = d.summary || '';
    if(summaryEl.value !== val) summaryEl.value = val;
  }

  const ringNum = document.getElementById('ringNum');
  if(ringNum){ ringNum.textContent = overall.pct===null?'—':Math.round(overall.pct)+'%'; ringNum.style.color = bandColorVar(b); }
  const ringProg = document.getElementById('ringProgress');
  if(ringProg){
    const circumference = 2*Math.PI*40;
    const dash = overall.pct===null?0:Math.min(100,overall.pct)/100*circumference;
    ringProg.setAttribute('stroke-dasharray', `${dash} ${circumference}`);
    ringProg.setAttribute('stroke', bandColorVar(b));
  }
  const statScore = document.getElementById('statScore'); if(statScore) statScore.textContent = `${overall.score}/${overall.weight}`;
  const statAnswered = document.getElementById('statAnswered'); if(statAnswered) statAnswered.textContent = `${overall.answered}/${TOTAL_ITEMS}`;

  sections.forEach(s=>{
    const bar = document.getElementById('secbar-'+s.num);
    const lbl = document.getElementById('seclbl-'+s.num);
    const sb = band(s.pct);
    if(bar){ bar.style.width = (s.pct?Math.min(100,s.pct):0)+'%'; bar.style.background = bandColorVar(sb); }
    if(lbl){ lbl.textContent = `${s.score}/${s.weight}점 · ${fmtPct(s.pct)}`; }
  });

  ALL_ITEMS.forEach(it=>{
    const rec = d[it.id];
    const rating = rec ? rec.rating : undefined;
    const group = document.getElementById('rate-'+it.id);
    if(group){
      group.querySelectorAll('.rate-btn').forEach(btn=> btn.classList.toggle('active', btn.dataset.val===rating));
    }
    const scoreEl = document.getElementById('score-'+it.id);
    if(scoreEl){
      const scored = rating ? (rating==='na'?null: rating==='good'?it.good:rating==='mid'?it.mid:it.low) : undefined;
      scoreEl.textContent = !rating ? `배점 ${it.weight}점 · 미응답`
        : rating==='na' ? `해당없음 (배점 제외)`
        : `배점 ${it.weight}점 · 획득 ${scored}점`;
    }
    const noteEl = document.getElementById('note-'+it.id);
    if(noteEl && document.activeElement!==noteEl){
      const val = (rec&&rec.note)||'';
      if(noteEl.value !== val) noteEl.value = val;
    }
  });
}

function renderMain(){
  renderTabs();
  if(currentView==='dashboard' || !siteRegistry[currentView]){
    currentView = 'dashboard';
    renderDashboard();
  } else {
    renderSiteView(currentView);
  }
}

/* ====================== PDF EXPORT ====================== */
const PRINT_RATING_LABEL = { good:'우수', mid:'보통', low:'미흡', na:'해당없음' };
const PRINT_RATING_COLOR = { good:'#1E8A5F', mid:'#B8790E', low:'#C0392B', na:'#7C8A99' };

/* large photo evidence frame for the PDF report — same idea as a 사진대지:
   1 photo fills the frame, 2 sit side by side, 3 stack one-over-two, all shown large
   (not small thumbnails). Each photo's own 채움/맞춤(cover·contain) toggle from the
   editing screen carries through here; a 사진칸(슬롯)에 합쳐진 사진들은 하나의 프레임으로
   묶여 보이고, 슬롯에 입력한 설명(caption)은 프레임 위 진한 남색 띠로 표시됩니다. */
function printPhotoFrameHtml(groupPhotos){
  if(!groupPhotos.length) return '';
  const shown = groupPhotos.slice(0,3);
  const n = shown.length;
  const cellStyle = 'overflow:hidden;background:#fff;border-radius:3px;';
  const imgStyleFor = p => `width:100%;height:100%;object-fit:${p.fit==='contain'?'contain':'cover'};display:block;`;
  let gridStyle, cellsHtml;
  if(n===1){
    gridStyle = 'grid-template-columns:1fr;';
    cellsHtml = `<div style="${cellStyle}"><img src="${shown[0].data}" style="${imgStyleFor(shown[0])}"></div>`;
  } else if(n===2){
    gridStyle = 'grid-template-columns:1fr 1fr;';
    cellsHtml = shown.map(p=>`<div style="${cellStyle}"><img src="${p.data}" style="${imgStyleFor(p)}"></div>`).join('');
  } else {
    gridStyle = 'grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;';
    cellsHtml = `<div style="${cellStyle}grid-column:1 / span 2;"><img src="${shown[0].data}" style="${imgStyleFor(shown[0])}"></div>`
      + shown.slice(1).map(p=>`<div style="${cellStyle}"><img src="${p.data}" style="${imgStyleFor(p)}"></div>`).join('');
  }
  const caption = (shown[0].caption || '').trim();
  const captionHtml = caption
    ? `<div style="background:#0F3A4F;color:#fff;font-weight:700;font-size:11.5px;text-align:center;padding:7px 6px;letter-spacing:.01em;">${escapeHtml(caption)}</div>`
    : '';
  /* min-width:0 so this sits cleanly as one cell inside the item's 4-column slot grid
     (see printItemRowHtml) — grid stretches it to the column width automatically */
  return `<div style="min-width:0;border:1px solid #C7D0D6;border-radius:6px;overflow:hidden;background:#fff;">
    ${captionHtml}
    <div style="padding:3px;display:grid;gap:3px;height:190px;background:#fff;${gridStyle}">${cellsHtml}</div>
  </div>`;
}

function printItemRowHtml(period, siteId, it, rec){
  const rating = rec && rec.rating;
  const scored = rating ? (rating==='na' ? null : rating==='good'?it.good : rating==='mid'?it.mid : it.low) : undefined;
  const c = rating ? PRINT_RATING_COLOR[rating] : '#9AA5AD';
  const badgeLabel = rating ? PRINT_RATING_LABEL[rating] : '미응답';
  const scoreTxt = !rating ? `배점 ${it.weight}점` : rating==='na' ? '배점 제외' : `배점 ${it.weight}점 · 획득 ${scored}점`;
  const noteHtml = rec.note ? `<div style="font-size:11.5px;color:#4B5A68;background:#F5F8F9;border-radius:6px;padding:6px 8px;margin-top:6px;white-space:pre-wrap;">${escapeHtml(rec.note)}</div>` : '';
  const photos = (recordPhotos[recKey(period,siteId)]||[]).filter(p=>p.itemId===it.id);
  const groups = groupPhotosByBlock(photos);
  /* 화면의 4칸 슬롯과 같은 순서로, 채워진 칸만 한 줄에 나란히 배치 (1~4칸 모두 4열 그리드
     안에 놓여 항상 같은 크기를 유지 — 1장만 있어도 전체 폭으로 늘어나지 않음) */
  const photosHtml = groups.length
    ? `<div style="margin-top:8px;display:grid;grid-template-columns:repeat(${MAX_PHOTO_SLOTS},1fr);gap:6px;">${groups.map(g=> printPhotoFrameHtml(g.photos)).join('')}</div>`
    : '';
  return `
  <div style="padding:9px 0;border-top:1px solid #E5EAEC;">
    <div style="display:flex;gap:8px;align-items:flex-start;">
      <div style="flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:#F5F8F9;color:#7C8A99;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;">${it.no}</div>
      <div style="flex:1;font-size:12px;line-height:1.5;white-space:pre-wrap;color:#16212B;">${escapeHtml(it.criteria)}</div>
      <div style="flex:0 0 auto;text-align:right;">
        <span style="display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:700;background:${c}22;color:${c};border:1px solid ${c}66;">${badgeLabel}</span>
        <div style="font-size:10px;color:#7C8A99;margin-top:3px;">${scoreTxt}</div>
      </div>
    </div>
    ${noteHtml}
    ${photosHtml}
  </div>`;
}

function buildHeaderChunk(period, siteId){
  const d = recordData[recKey(period,siteId)] || {};
  const { overall } = computeRecord(siteId);
  const el = document.createElement('div');
  el.style.cssText = 'font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; padding:22px 6px 10px; color:#16212B;';
  el.innerHTML = `
    <div style="font-size:11px;color:#7C8A99;letter-spacing:.03em;margin-bottom:4px;">중대재해처벌법 이행점검 · 서류심사 결과보고 · ${escapeHtml(periodLabel(period))}</div>
    <div style="font-size:24px;font-weight:700;margin-bottom:14px;">${escapeHtml(siteName(siteId))}</div>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;">
      <tr>
        <td style="padding:5px 0;color:#7C8A99;width:80px;">점검자</td><td style="padding:5px 0;font-weight:600;">${escapeHtml(d.inspector || '-')}</td>
        <td style="padding:5px 0;color:#7C8A99;width:80px;">점검일자</td><td style="padding:5px 0;font-weight:600;">${escapeHtml(d.date || '-')}</td>
      </tr>
    </table>
    <div style="display:flex;gap:22px;margin-top:14px;padding:14px 16px;background:#F5F8F9;border-radius:8px;">
      <div><div style="font-size:20px;font-weight:700;">${overall.score}/${overall.weight}</div><div style="font-size:10.5px;color:#7C8A99;">획득점수/배점</div></div>
      <div><div style="font-size:20px;font-weight:700;">${overall.pct===null?'-':Math.round(overall.pct)+'%'}</div><div style="font-size:10.5px;color:#7C8A99;">환산점수</div></div>
      <div><div style="font-size:20px;font-weight:700;">${overall.answered}/${TOTAL_ITEMS}</div><div style="font-size:10.5px;color:#7C8A99;">응답 문항</div></div>
    </div>`;
  return el;
}

function buildSectionChunk(period, siteId, sec){
  const s = computeRecord(siteId).sections.find(x=>x.num===sec.num);
  const d = recordData[recKey(period,siteId)] || {};
  const el = document.createElement('div');
  el.style.cssText = 'font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; padding:8px 6px 12px; color:#16212B;';
  const itemsHtml = sec.items.map(it=> printItemRowHtml(period, siteId, it, d[it.id] || {})).join('');
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #16212B;padding-bottom:6px;margin-bottom:8px;">
      <div style="font-size:14px;font-weight:700;">${sec.num}. ${escapeHtml(sec.title)}</div>
      <div style="font-size:12px;font-weight:600;color:#4B5A68;">${s.score}/${s.weight}점 · ${fmtPct(s.pct)}</div>
    </div>
    ${itemsHtml}`;
  return el;
}

function buildSummaryChunk(period, siteId){
  const d = recordData[recKey(period,siteId)] || {};
  const summary = (d.summary||'').trim();
  if(!summary) return null;
  const el = document.createElement('div');
  el.style.cssText = 'font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; padding:14px 6px 22px; color:#16212B;';
  el.innerHTML = `
    <div style="border-bottom:2px solid #16212B;padding-bottom:6px;margin-bottom:10px;">
      <div style="font-size:14px;font-weight:700;">종합의견</div>
    </div>
    <div style="font-size:12.5px;line-height:1.75;white-space:pre-wrap;background:#F5F8F9;border-radius:8px;padding:14px 16px;">${escapeHtml(summary)}</div>`;
  return el;
}

function buildPrintChunks(period, siteId){
  const chunks = [ buildHeaderChunk(period, siteId), ...SECTIONS.map(sec => buildSectionChunk(period, siteId, sec)) ];
  const summaryChunk = buildSummaryChunk(period, siteId);
  if(summaryChunk) chunks.push(summaryChunk);
  return chunks;
}

/* ====================== PDF PREVIEW MODAL ====================== */
let pdfPreviewSpec = null; // { period, siteId }

function openPdfPreview(period, siteId){
  pdfPreviewSpec = { period, siteId };
  const body = document.getElementById('pdfPreviewBody');
  body.innerHTML = '';
  const sheet = document.createElement('div');
  sheet.className = 'pdf-preview-sheet';
  buildPrintChunks(period, siteId).forEach(chunk => sheet.appendChild(chunk));
  body.appendChild(sheet);

  const saveBtn = document.getElementById('pdfPreviewSaveBtn');
  saveBtn.disabled = false; saveBtn.textContent = 'PDF 저장';
  document.getElementById('pdfPreviewModal').hidden = false;
}

function closePdfPreview(){
  const modal = document.getElementById('pdfPreviewModal');
  if(modal) modal.hidden = true;
  pdfPreviewSpec = null;
  const saveBtn = document.getElementById('pdfPreviewSaveBtn');
  if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'PDF 저장'; }
}

async function confirmPdfSave(){
  if(!pdfPreviewSpec) return;
  const { period, siteId } = pdfPreviewSpec;
  const saveBtn = document.getElementById('pdfPreviewSaveBtn');
  if(!saveBtn || saveBtn.disabled) return;
  const original = saveBtn.textContent;
  saveBtn.disabled = true;

  if(typeof window.jspdf === 'undefined' || typeof window.html2canvas === 'undefined'){
    saveBtn.textContent = '문서 도구 불러오는 중…';
    for(let i=0; i<20 && (typeof window.jspdf==='undefined' || typeof window.html2canvas==='undefined'); i++){
      await new Promise(r=>setTimeout(r,300));
    }
  }
  if(typeof window.jspdf === 'undefined' || typeof window.html2canvas === 'undefined'){
    toast('PDF 생성 도구를 불러오지 못했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.');
    saveBtn.disabled = false; saveBtn.textContent = original;
    return;
  }

  const host = document.createElement('div');
  host.style.cssText = 'position:fixed; left:-99999px; top:0; width:800px; background:#ffffff;';
  document.body.appendChild(host);

  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = 210, pageH = 297, margin = 10;
    const contentW = pageW - margin*2;
    let cursorY = margin;

    function placeCanvas(canvas){
      const imgW = contentW;
      const imgH = canvas.height * imgW / canvas.width;
      if(imgH > pageH - margin*2){
        let remaining = imgH, srcY = 0;
        while(remaining > 0.3){
          if(cursorY >= pageH - margin - 5){ pdf.addPage(); cursorY = margin; }
          const drawH = Math.min(pageH - margin - cursorY, remaining);
          const sliceCanvas = document.createElement('canvas');
          sliceCanvas.width = canvas.width;
          sliceCanvas.height = Math.max(1, Math.round(drawH * canvas.width / imgW));
          sliceCanvas.getContext('2d').drawImage(
            canvas, 0, Math.round(srcY*canvas.width/imgW), canvas.width, sliceCanvas.height,
            0, 0, canvas.width, sliceCanvas.height
          );
          pdf.addImage(sliceCanvas.toDataURL('image/jpeg',0.9), 'JPEG', margin, cursorY, imgW, drawH);
          cursorY += drawH; srcY += drawH; remaining -= drawH;
          if(remaining > 0.3){ pdf.addPage(); cursorY = margin; }
        }
      } else {
        if(cursorY + imgH > pageH - margin){ pdf.addPage(); cursorY = margin; }
        pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', margin, cursorY, imgW, imgH);
        cursorY += imgH + 3;
      }
    }

    const chunks = buildPrintChunks(period, siteId); // fresh DOM nodes, independent of the ones shown in the preview
    for(let i=0; i<chunks.length; i++){
      saveBtn.textContent = `PDF 생성 중… (${i+1}/${chunks.length})`;
      host.innerHTML = '';
      host.appendChild(chunks[i]);
      const canvas = await window.html2canvas(chunks[i], { scale:1.5, backgroundColor:'#ffffff', useCORS:true });
      placeCanvas(canvas);
    }

    const blob = pdf.output('blob');
    const d = recordData[recKey(period,siteId)] || {};
    const safeName = siteName(siteId).replace(/[\\/:*?"<>|]/g,'_');
    const filename = `${safeName}_${period}_이행점검_${d.date || todayStr()}.pdf`;

    if(downloadsCap){
      saveBtn.textContent = '저장 확인 대기 중…';
      try{
        await downloadsCap.save({ filename, data: blob });
        saveBtn.textContent = '저장 완료';
        setTimeout(()=> closePdfPreview(), 1200);
        return;
      }catch(e){
        if(e && e.code === 'declined'){ saveBtn.disabled = false; saveBtn.textContent = original; return; }
        console.warn('downloads.save 실패', e);
      }
    }
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
    closePdfPreview();
  } catch(err){
    console.error(err);
    toast('PDF 생성 중 문제가 발생했습니다. 다시 시도해 주세요.');
  } finally {
    document.body.removeChild(host);
    if(saveBtn.textContent !== '저장 완료'){ saveBtn.disabled = false; saveBtn.textContent = original; }
  }
}

function wirePdfPreviewModalOnce(){
  document.getElementById('pdfPreviewClose').addEventListener('click', closePdfPreview);
  document.getElementById('pdfPreviewCancelBtn').addEventListener('click', closePdfPreview);
  document.getElementById('pdfPreviewSaveBtn').addEventListener('click', confirmPdfSave);
  document.getElementById('pdfPreviewModal').addEventListener('click', (e)=>{ if(e.target.id==='pdfPreviewModal') closePdfPreview(); });
  document.addEventListener('keydown', (e)=>{
    const modal = document.getElementById('pdfPreviewModal');
    if(modal.hidden) return;
    if(e.key==='Escape') closePdfPreview();
  });
}

/* ====================== UTIL ====================== */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ====================== BOOT / DB ====================== */
function setSaveBadge(state){
  const el = document.getElementById('saveBadge');
  if(!el) return;
  if(state==='live'){ el.textContent = '☁ 자동 저장 중 (팀 공유)'; el.classList.add('live'); }
  else if(state==='local'){ el.textContent = '⚠ 저장 미지원 보기 · 새로고침 시 초기화'; el.classList.remove('live'); }
  else { el.textContent = '연결 확인 중…'; el.classList.remove('live'); }
}

function initPeriodSelect(){
  const sel = document.getElementById('periodSelect');
  sel.innerHTML = PERIOD_OPTIONS.map(p=>`<option value="${p.key}">${p.label}</option>`).join('');
  if(!PERIOD_OPTIONS.find(p=>p.key===currentPeriod)){
    const opt = document.createElement('option');
    opt.value = currentPeriod; opt.textContent = periodLabel(currentPeriod);
    sel.appendChild(opt);
  }
  sel.value = currentPeriod;
  sel.addEventListener('change', ()=> switchPeriod(sel.value));
}

function subscribeRecord(period, siteId){
  if(!db) return;
  subscribedSiteIds.add(siteId);
  const key = recKey(period, siteId);
  try{
    const unsub1 = db.doc('records/'+key).onSnapshot(snap=>{
      recordExists[key] = snap.exists;
      if(snap.exists) recordData[key] = snap.data();
      else if(!recordData[key]) recordData[key] = {};
      renderTabs();
      if(currentView===siteId && currentPeriod===period) syncSiteView(siteId);
      if(currentView==='dashboard' && currentPeriod===period) renderDashboard();
    }, err=>{ console.warn('record snapshot error', key, err); });
    activeRecordUnsubs.push(unsub1);
  }catch(e){ console.warn(e); }
  try{
    const unsub2 = db.doc('records/'+key).collection('photos').onSnapshot(snap=>{
      recordPhotos[key] = snap.docs.map(doc=> ({ id: doc.id, ...doc.data() }));
      if(currentView===siteId && currentPeriod===period) refreshPhotoThumbs(siteId);
    }, err=>{ console.warn('photo snapshot error', key, err); });
    activeRecordUnsubs.push(unsub2);
  }catch(e){ console.warn(e); }
}

function subscribeAllForPeriod(period){
  siteOrder.forEach(id => subscribeRecord(period, id));
}
function unsubscribeAllRecords(){
  activeRecordUnsubs.forEach(fn=>{ try{ fn(); }catch(e){} });
  activeRecordUnsubs = [];
}

function switchPeriod(newPeriod){
  currentPeriod = newPeriod;
  currentView = 'dashboard';
  unsubscribeAllRecords();
  subscribedSiteIds.clear();
  if(db) subscribeAllForPeriod(currentPeriod);
  renderMain();
}

async function boot(){
  applyPhotoDisplaySize();
  initPeriodSelect();
  wireLightboxOnce();
  wireAppDelegationOnce();
  wirePhotoPreviewModalOnce();
  wirePdfPreviewModalOnce();
  renderTabs();
  renderMain();
  db = initFirebaseDb();

  if(!db){ setSaveBadge('local'); return; }
  setSaveBadge('live');

  downloadsCap = { save: browserSave };

  let registrySeeded = false;
  try{
    db.collection('siteRegistry').orderBy('order').onSnapshot(snap=>{
      if(snap.empty && !registrySeeded){
        registrySeeded = true;
        Promise.all(DEFAULT_SITE_SEED.map((s,i)=>
          db.doc('siteRegistry/'+s.id).set({ name: s.name, order: i, createdAt: new Date().toISOString() })
        )).catch(e=> console.warn('초기 현장 생성 실패', e));
        return; // the write triggers a fresh snapshot that populates the registry below
      }
      const newRegistry = {};
      const newOrder = [];
      snap.docs.forEach(doc=>{ newRegistry[doc.id] = doc.data(); newOrder.push(doc.id); });
      siteRegistry = newRegistry;
      siteOrder = newOrder;

      const added = siteOrder.filter(id => !subscribedSiteIds.has(id));
      added.forEach(id => subscribeRecord(currentPeriod, id));

      if(currentView!=='dashboard' && !siteRegistry[currentView]) currentView = 'dashboard';
      renderMain();
    }, err=>{ console.warn('registry snapshot error', err); });
  }catch(e){ console.warn(e); }
}

boot();
</script>
